# Gloss — ko_KR
#
# === 파일 편집 ===
# plugins/Gloss/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /gloss language server edit ko_KR
#
# === 접두사 ===
# 접두사: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {absorbed}  기존 데이터에 병합한 가져오기 항목 수
#   {active}  활성 공급자 수
#   {actual}  현재 리비전
#   {after}  편집 후 메시지 값
#   {argument}  예상하지 못한 명령 인수
#   {axis}  좌표축 또는 회전축
#   {bees}  용기 안의 벌 수
#   {before}  편집 전 메시지 값
#   {billboard}  표시 방향 모드
#   {blocks}  블록 표시 요소 수
#   {board}  보드 또는 패널 식별자
#   {bottles}  용기 안의 병 수
#   {bubbles}  활성 채팅 말풍선 수
#   {cells}  메뉴 칸 수
#   {color}  표시 또는 아이템 색상
#   {command}  명령 경로
#   {conflicts}  가져오기 충돌 수
#   {copied}  복사한 항목 수
#   {count}  일치하는 객체 또는 메시지 수
#   {disc}  용기 안의 음악 음반
#   {distance}  대상까지의 거리
#   {drops}  표시되는 드롭 아이템 수
#   {enabled}  활성화 상태 또는 활성 항목 수
#   {entities}  개체 수
#   {error}  검증 또는 작업 오류
#   {errors}  오류 수
#   {expected}  편집 저장 시 예상 리비전
#   {experience}  획득한 경험치량
#   {failed}  실패한 작업 수
#   {from}  원본 값 또는 범위 시작
#   {fuel}  용기에 남은 연료
#   {group}  언어 편집기 분류
#   {hologram}  홀로그램 식별자
#   {honey}  현재 꿀 수치
#   {id}  객체 식별자
#   {imported}  가져온 항목 수
#   {indicators}  피해 표시기 수
#   {interactPermission}  상호작용에 필요한 권한
#   {interactionRange}  최대 상호작용 거리
#   {item}  아이템 이름 또는 재료
#   {key}  메시지 또는 설정 키
#   {kind}  객체 또는 공급자 유형
#   {kinds}  사용 가능한 객체 또는 공급자 유형
#   {labels}  텍스트 라벨 수
#   {legacy}  가져오기 원본 식별자
#   {level}  표시 레벨
#   {limit}  허용 한도
#   {line}  메시지 내 줄 번호
#   {locale}  언어 코드
#   {maximum}  허용 최댓값
#   {maximumBees}  최대 벌 수
#   {maximumHoney}  최대 꿀 수치
#   {menu}  메뉴 식별자
#   {message}  응답 또는 진단 메시지
#   {migrated}  변환한 항목 수
#   {minimum}  허용 최솟값
#   {mode}  선택한 작업 또는 표시 모드
#   {name}  객체 이름
#   {oldBoard}  이전 보드 식별자
#   {operation}  작업 이름
#   {options}  사용 가능한 명령 옵션
#   {overlaid}  적용한 설정 키 수
#   {page}  현재 페이지 번호
#   {pages}  전체 페이지 수
#   {panels}  패널 수
#   {parameter}  명령 매개변수 이름
#   {path}  파일 또는 폴더 경로
#   {pending}  대기 중인 게시 상태
#   {percent}  백분율 값
#   {permission}  필요한 권한
#   {personal}  개인 언어 코드
#   {pitch}  수직 각도
#   {player}  플레이어 이름
#   {plugin}  플러그인 이름
#   {priority}  선택 또는 렌더링 우선순위
#   {provider}  공급자 이름
#   {providers}  공급자 목록 또는 수
#   {radius}  검색 반경
#   {ready}  가져올 준비가 된 항목 수
#   {reason}  오류 또는 결정의 이유
#   {resume}  가져오기를 재개할 수 있는 항목 수
#   {revision}  문서 리비전
#   {roll}  롤 각도
#   {rotation}  표시 회전
#   {scale}  표시 또는 미리 보기 배율
#   {seconds}  시간(초)
#   {section}  언어 편집기에 표시되는 섹션
#   {session}  편집 세션 식별자
#   {severity}  진단 심각도
#   {skipped}  건너뛴 항목 수
#   {slots}  아이템 슬롯 수
#   {source}  가져오기 원본 또는 설정 공급자
#   {special}  특수 표시 요소 수
#   {state}  현재 상태
#   {style}  표시 스타일
#   {subject}  웹 편집 세션에서 편집하는 대상
#   {target}  언어 선택을 적용할 플러그인
#   {temporary}  임시 객체 수
#   {text}  표시되는 텍스트
#   {title}  표시 제목
#   {to}  대상 값 또는 범위 끝
#   {total}  전체 항목 수
#   {type}  예상 값 또는 객체 유형
#   {url}  웹 주소
#   {usage}  명령 구문
#   {uuid}  객체 또는 플레이어의 고유 식별자
#   {value}  현재 메시지 또는 매개변수 값
#   {variables}  메시지에 허용되는 변수
#   {variants}  표시 변형 수 또는 목록
#   {viewPermission}  보기에 필요한 권한
#   {viewRange}  최대 시야 거리
#   {warnings}  경고 수
#   {when}  표시 조건
#   {world}  월드 이름
#   {x}  X 좌표
#   {y}  Y 좌표
#   {yaw}  수평 각도
#   {z}  Z 좌표

