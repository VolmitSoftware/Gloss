# Gloss — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/Gloss/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /gloss language server edit fi_FI
#
# === Etuliite ===
# Etuliite &8[&dGloss&8] on osa jokaista viestiä: muuta sitä haluamissasi viesteissä.
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {absorbed}  Olemassa oleviin tietoihin yhdistetyt tuontimerkinnät
#   {active}  Aktiivisten tarjoajien määrä
#   {actual}  Nykyinen versio
#   {after}  Viestin arvo muokkauksen jälkeen
#   {argument}  Odottamaton komentoargumentti
#   {axis}  Koordinaatti- tai kiertoakseli
#   {bees}  Säiliössä olevien mehiläisten määrä
#   {before}  Viestin arvo ennen muokkausta
#   {billboard}  Näyttökohteen suuntaustila
#   {blocks}  Lohkonäyttöelementtien määrä
#   {board}  Taulun tai paneelin tunniste
#   {bottles}  Säiliössä olevien pullojen määrä
#   {bubbles}  Aktiivisten puhekuplien määrä
#   {cells}  Valikon solujen määrä
#   {color}  Näytön tai esineen väri
#   {command}  Komentopolku
#   {conflicts}  Tuontiristiriitojen määrä
#   {copied}  Kopioitujen merkintöjen määrä
#   {count}  Vastaavien kohteiden tai viestien määrä
#   {disc}  Säiliössä oleva musiikkilevy
#   {distance}  Etäisyys kohteeseen
#   {drops}  Näytettävien pudotettujen esineiden määrä
#   {enabled}  Käyttötila tai käytössä olevien merkintöjen määrä
#   {entities}  Entiteettien määrä
#   {error}  Validointi- tai toimintavirhe
#   {errors}  Virheiden määrä
#   {expected}  Muokkausta tallennettaessa odotettu versio
#   {experience}  Saadun kokemuksen määrä
#   {failed}  Epäonnistuneiden toimintojen määrä
#   {from}  Lähdearvo tai alueen alku
#   {fuel}  Säiliön jäljellä oleva polttoaine
#   {group}  Kielieditorin luokka
#   {hologram}  Hologrammin tunniste
#   {honey}  Nykyinen hunajataso
#   {id}  Kohteen tunniste
#   {imported}  Tuotujen merkintöjen määrä
#   {indicators}  Vahinkoilmaisimien määrä
#   {interactPermission}  Vuorovaikutukseen vaadittu oikeus
#   {interactionRange}  Suurin vuorovaikutusetäisyys
#   {item}  Esineen nimi tai materiaali
#   {key}  Viestin tai asetuksen avain
#   {kind}  Kohteen tai tarjoajan tyyppi
#   {kinds}  Saatavilla olevat kohde- tai tarjoajatyypit
