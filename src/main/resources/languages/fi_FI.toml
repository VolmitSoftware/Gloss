#   {maximumHoney}  Suurin hunajataso
#   {menu}  Valikon tunniste
#   {message}  Palaute- tai diagnostiikkaviesti
#   {migrated}  Muunnettujen merkintöjen määrä
#   {minimum}  Pienin sallittu arvo
#   {mode}  Valittu toiminta- tai näyttötila
#   {name}  Kohteen nimi
#   {oldBoard}  Edellisen taulun tunniste
#   {operation}  Toiminnon nimi
