# Gloss — he_IL
#
# === עריכת הקובץ ===
# plugins/Gloss/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /gloss language server edit he_IL
#
# === קידומת ===
# קידומת: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === עיצוב ===
# צבעים: &0-&f, &k-&r, &#RRGGBB.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {absorbed}  רשומות שיובאו ומוזגו בנתונים קיימים
#   {active}  מספר הספקים הפעילים
#   {actual}  הגרסה הנוכחית
#   {after}  ערך ההודעה לאחר העריכה
#   {argument}  ארגומנט פקודה לא צפוי
#   {axis}  ציר קואורדינטות או סיבוב
#   {bees}  מספר הדבורים במכל
#   {before}  ערך ההודעה לפני העריכה
#   {billboard}  מצב כיוון התצוגה
#   {blocks}  מספר רכיבי תצוגת הבלוקים
#   {board}  מזהה הלוח או הפאנל
#   {bottles}  מספר הבקבוקים במכל
#   {bubbles}  מספר בועות הצ׳אט הפעילות
#   {cells}  מספר תאי התפריט
#   {color}  צבע התצוגה או הפריט
#   {command}  נתיב הפקודה
#   {conflicts}  מספר התנגשויות הייבוא
#   {copied}  מספר הרשומות שהועתקו
#   {count}  מספר העצמים או ההודעות התואמים
#   {disc}  תקליט המוזיקה במכל
#   {distance}  המרחק ליעד
#   {drops}  מספר תצוגות הפריטים שנפלו
#   {enabled}  מצב ההפעלה או מספר הרשומות הפעילות
#   {entities}  מספר הישויות
#   {error}  שגיאת אימות או פעולה
#   {errors}  מספר השגיאות
#   {expected}  הגרסה הצפויה בשמירת העריכה
#   {experience}  כמות הניסיון שהתקבלה
#   {failed}  מספר הפעולות שנכשלו
#   {from}  ערך המקור או תחילת הטווח
#   {fuel}  הדלק שנותר במכל
#   {group}  קטגוריית עורך השפות
#   {hologram}  מזהה ההולוגרמה
#   {honey}  רמת הדבש הנוכחית
#   {id}  מזהה העצם
#   {imported}  מספר הרשומות שיובאו
#   {indicators}  מספר מחווני הנזק
#   {interactPermission}  ההרשאה הנדרשת לאינטראקציה
#   {interactionRange}  המרחק המרבי לאינטראקציה
#   {item}  שם הפריט או החומר
#   {key}  מפתח הודעה או הגדרה
#   {kind}  סוג העצם או הספק
#   {kinds}  סוגי העצמים או הספקים הזמינים
#   {labels}  מספר תוויות הטקסט
#   {legacy}  מזהה במקור הייבוא
#   {level}  הרמה המוצגת
#   {limit}  הגבול המותר
#   {line}  מספר השורה בהודעה
#   {locale}  קוד השפה
#   {maximum}  הערך המרבי המותר
#   {maximumBees}  מספר הדבורים המרבי
#   {maximumHoney}  רמת הדבש המרבית
#   {menu}  מזהה התפריט
#   {message}  הודעת משוב או אבחון
#   {migrated}  מספר הרשומות שהומרו
#   {minimum}  הערך המזערי המותר
#   {mode}  מצב הפעולה או התצוגה הנבחר
#   {name}  שם העצם
#   {oldBoard}  מזהה הלוח הקודם
#   {operation}  שם הפעולה
#   {options}  אפשרויות הפקודה הזמינות
#   {overlaid}  מספר מפתחות ההגדרה שהוחלו
#   {page}  מספר העמוד הנוכחי
#   {pages}  מספר העמודים הכולל
#   {panels}  מספר הפאנלים
#   {parameter}  שם פרמטר הפקודה
#   {path}  נתיב הקובץ או התיקייה
#   {pending}  מצב פרסום השינויים הממתינים
#   {percent}  ערך באחוזים
#   {permission}  ההרשאה הנדרשת
#   {personal}  קוד השפה האישי
#   {pitch}  זווית אנכית במעלות
#   {player}  שם השחקן
#   {plugin}  שם התוסף
#   {priority}  עדיפות בחירה או ציור
#   {provider}  שם הספק
#   {providers}  רשימת הספקים או מספרם
#   {radius}  רדיוס החיפוש
#   {ready}  מספר הרשומות המוכנות לייבוא
#   {reason}  הסיבה לשגיאה או להחלטה
#   {resume}  מספר רשומות הייבוא שניתן לחדש
#   {revision}  גרסת המסמך
#   {roll}  זווית גלגול במעלות
#   {rotation}  סיבוב התצוגה
#   {scale}  קנה המידה של התצוגה או התצוגה המקדימה
#   {seconds}  משך בשניות
#   {session}  מזהה הפעלת העורך
#   {severity}  חומרת האבחון
#   {skipped}  מספר הרשומות שדולגו
#   {slots}  מספר משבצות הפריטים
#   {source}  מקור הייבוא או ספק ההגדרות
#   {special}  מספר רכיבי התצוגה המיוחדים
#   {state}  המצב הנוכחי
#   {style}  סגנון התצוגה
#   {subject}  העצם הנערך בהפעלת עורך הרשת
#   {target}  התוסף שמקבל את בחירת השפה
#   {temporary}  מספר העצמים הזמניים
#   {text}  הטקסט המוצג
#   {title}  הכותרת המוצגת
#   {to}  ערך היעד או סוף הטווח
#   {total}  מספר הרשומות הכולל
#   {type}  סוג הערך או העצם הצפוי
#   {url}  כתובת האינטרנט
#   {usage}  תחביר הפקודה
#   {uuid}  מזהה ייחודי של עצם או שחקן
#   {value}  ערך ההודעה או הפרמטר הנוכחי
#   {variables}  מצייני המקום המותרים בהודעה
#   {variants}  מספר גרסאות התצוגה או רשימתן
#   {viewPermission}  ההרשאה הנדרשת לצפייה
#   {viewRange}  מרחק הצפייה המרבי
#   {warnings}  מספר האזהרות
#   {when}  תנאי התצוגה
#   {world}  שם העולם
#   {x}  קואורדינטת X
#   {y}  קואורדינטת Y
#   {yaw}  זווית אופקית במעלות
#   {z}  קואורדינטת Z

