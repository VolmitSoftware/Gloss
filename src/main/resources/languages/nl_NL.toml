# Gloss — nl_NL
#
# === Bestand bewerken ===
# plugins/Gloss/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /gloss language server edit nl_NL
#
# === Voorvoegsel ===
# Het voorvoegsel &8[&dGloss&8] staat in elk bericht zelf: pas het in de betreffende berichten aan.
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {absorbed}  Geïmporteerde vermeldingen samengevoegd met bestaande gegevens
#   {active}  Aantal actieve providers
#   {actual}  Huidige revisie
#   {after}  Berichtwaarde na bewerking
#   {argument}  Onverwacht opdrachtargument
#   {axis}  Coördinaat- of rotatieas
#   {bees}  Aantal bijen in de container
#   {before}  Berichtwaarde vóór bewerking
#   {billboard}  Oriëntatiemodus van de weergave
#   {blocks}  Aantal blokweergave-elementen
#   {board}  Identificatie van het bord of paneel
#   {bottles}  Aantal flessen in de container
#   {bubbles}  Aantal actieve chatballonnen
#   {cells}  Aantal menucellen
#   {color}  Kleur van de weergave of het voorwerp
#   {command}  Opdrachtpad
#   {conflicts}  Aantal importconflicten
#   {copied}  Aantal gekopieerde vermeldingen
#   {count}  Aantal overeenkomende objecten of berichten
#   {disc}  Muziekplaat in de container
#   {distance}  Afstand tot het doel
#   {drops}  Aantal weergegeven gevallen voorwerpen
#   {enabled}  Inschakelstatus of aantal ingeschakelde vermeldingen
#   {entities}  Aantal entiteiten
#   {error}  Validatie- of bewerkingsfout
#   {errors}  Aantal fouten
#   {expected}  Verwachte revisie bij het opslaan van een bewerking
#   {experience}  Hoeveelheid verdiende ervaring
#   {failed}  Aantal mislukte bewerkingen
#   {from}  Bronwaarde of begin van een bereik
#   {fuel}  Resterende brandstof in de container
#   {group}  Categorie van de taaleditor
#   {hologram}  Identificatie van het hologram
#   {honey}  Huidig honingniveau
#   {id}  Objectidentificatie
#   {imported}  Aantal geïmporteerde vermeldingen
#   {indicators}  Aantal schade-indicatoren
#   {interactPermission}  Vereiste toestemming voor interactie
#   {interactionRange}  Maximale interactieafstand
#   {item}  Naam of materiaal van het voorwerp
#   {key}  Bericht- of configuratiesleutel
#   {kind}  Type object of provider
#   {kinds}  Beschikbare object- of providertypen
#   {labels}  Aantal tekstlabels
#   {legacy}  Identificatie van de importbron
#   {level}  Weergegeven niveau
#   {limit}  Toegestane limiet
#   {line}  Regelnummer binnen een bericht
#   {locale}  Taalcode
#   {maximum}  Maximaal toegestane waarde
#   {maximumBees}  Maximaal aantal bijen
#   {maximumHoney}  Maximaal honingniveau
#   {menu}  Menu-identificatie
#   {message}  Feedback- of diagnosebericht
#   {migrated}  Aantal geconverteerde vermeldingen
#   {minimum}  Minimaal toegestane waarde
#   {mode}  Geselecteerde bewerkings- of weergavemodus
#   {name}  Objectnaam
#   {oldBoard}  Identificatie van het vorige bord
#   {operation}  Naam van de bewerking
#   {options}  Beschikbare opdrachtopties
#   {overlaid}  Aantal toegepaste configuratiesleutels
#   {page}  Huidig paginanummer
#   {pages}  Totaal aantal pagina’s
#   {panels}  Aantal panelen
#   {parameter}  Naam van de opdrachtparameter
#   {path}  Bestands- of mappad
#   {pending}  Status van wijzigingen die op publicatie wachten
#   {percent}  Percentagewaarde
#   {permission}  Vereiste toestemming
#   {personal}  Persoonlijke taalcode
#   {pitch}  Verticale hoek in graden
#   {player}  Spelersnaam
#   {plugin}  Pluginnaam
#   {priority}  Selectie- of weergaveprioriteit
#   {provider}  Providernaam
#   {providers}  Lijst of aantal providers
#   {radius}  Zoekstraal
#   {ready}  Aantal vermeldingen klaar voor import
#   {reason}  Reden voor een fout of beslissing
#   {resume}  Aantal hervatbare importvermeldingen
#   {revision}  Documentrevisie
#   {roll}  Rolhoek in graden
#   {rotation}  Rotatie van de weergave
#   {scale}  Schaal van de weergave of het voorbeeld
#   {seconds}  Tijd in seconden
#   {session}  Identificatie van de editorsessie
#   {severity}  Ernst van de diagnose
#   {skipped}  Aantal overgeslagen vermeldingen
#   {slots}  Aantal voorwerpslots
#   {source}  Importbron of configuratieprovider
#   {special}  Aantal speciale weergave-elementen
#   {state}  Huidige toestand
#   {style}  Weergavestijl
#   {subject}  Onderwerp van de webeditorsessie
#   {target}  Plugin waarop de taalkeuze wordt toegepast
#   {temporary}  Aantal tijdelijke objecten
#   {text}  Weergegeven tekst
#   {title}  Weergegeven titel
#   {to}  Doelwaarde of einde van een bereik
#   {total}  Totaal aantal vermeldingen
#   {type}  Verwacht waarde- of objecttype
#   {url}  Webadres
#   {usage}  Opdrachtsyntaxis
#   {uuid}  Unieke identificatie van het object of de speler
#   {value}  Huidige bericht- of parameterwaarde
#   {variables}  Toegestane plaatshouders in het bericht
#   {variants}  Aantal of lijst van weergavevarianten
#   {viewPermission}  Vereiste toestemming om te bekijken
#   {viewRange}  Maximale kijkafstand
#   {warnings}  Aantal waarschuwingen
#   {when}  Weergavevoorwaarde
#   {world}  Wereldnaam
#   {x}  X-coördinaat
#   {y}  Y-coördinaat
#   {yaw}  Horizontale hoek in graden
#   {z}  Z-coördinaat

