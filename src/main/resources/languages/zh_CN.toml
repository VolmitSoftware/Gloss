# Gloss — zh_CN
#
# === 编辑文件 ===
# plugins/Gloss/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /gloss language server edit zh_CN
#
# === 前缀 ===
# 前缀: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === 格式 ===
# 颜色: &0-&f, &k-&r, &#RRGGBB.
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {absorbed}  合并到现有数据的导入条目数
#   {active}  活动提供程序数量
#   {actual}  当前修订版本
#   {after}  编辑后的消息值
#   {argument}  意外的命令参数
#   {axis}  坐标轴或旋转轴
#   {bees}  容器内蜜蜂数量
#   {before}  编辑前的消息值
#   {billboard}  显示朝向模式
#   {blocks}  方块显示元素数量
#   {board}  看板或面板标识符
#   {bottles}  容器内瓶子数量
#   {bubbles}  活动聊天气泡数量
#   {cells}  菜单单元格数量
#   {color}  显示或物品颜色
#   {command}  命令路径
#   {conflicts}  导入冲突数量
#   {copied}  已复制条目数量
#   {count}  匹配的对象或消息数量
#   {disc}  容器内音乐唱片
#   {distance}  距目标的距离
#   {drops}  显示的掉落物品数量
#   {enabled}  启用状态或已启用条目数量
#   {entities}  实体数量
#   {error}  验证或操作错误
#   {errors}  错误数量
#   {expected}  保存编辑时的预期修订版本
#   {experience}  获得的经验值
#   {failed}  失败的操作数量
#   {from}  源值或范围起点
#   {fuel}  容器内剩余燃料
#   {group}  语言编辑器类别
#   {hologram}  全息图标识符
#   {honey}  当前蜂蜜量
#   {id}  对象标识符
#   {imported}  已导入条目数量
#   {indicators}  伤害指示器数量
#   {interactPermission}  交互所需权限
#   {interactionRange}  最大交互距离
#   {item}  物品名称或材质
#   {key}  消息或配置键
#   {kind}  对象或提供程序类型
#   {kinds}  可用的对象或提供程序类型
#   {labels}  文本标签数量
#   {legacy}  导入源中的标识符
#   {level}  显示等级
#   {limit}  允许的限制
#   {line}  消息内的行号
#   {locale}  语言代码
#   {maximum}  允许的最大值
#   {maximumBees}  蜜蜂数量上限
#   {maximumHoney}  蜂蜜量上限
#   {menu}  菜单标识符
#   {message}  反馈或诊断消息
#   {migrated}  已转换条目数量
#   {minimum}  允许的最小值
#   {mode}  所选操作或显示模式
#   {name}  对象名称
#   {oldBoard}  之前的看板标识符
#   {operation}  操作名称
#   {options}  可用的命令选项
#   {overlaid}  已应用配置键数量
#   {page}  当前页码
#   {pages}  总页数
#   {panels}  面板数量
#   {parameter}  命令参数名称
#   {path}  文件或目录路径
#   {pending}  待发布状态
#   {percent}  百分比值
#   {permission}  所需权限
#   {personal}  个人语言代码
#   {pitch}  垂直角度
#   {player}  玩家名称
#   {plugin}  插件名称
#   {priority}  选择或渲染优先级
#   {provider}  提供程序名称
#   {providers}  提供程序列表或数量
#   {radius}  搜索半径
#   {ready}  可导入条目数量
#   {reason}  错误或决定的原因
#   {resume}  可恢复导入的条目数量
#   {revision}  文档修订版本
#   {roll}  滚转角度
#   {rotation}  显示旋转
#   {scale}  显示或预览缩放比例
#   {seconds}  时间（秒）
#   {session}  编辑会话标识符
#   {severity}  诊断严重程度
#   {skipped}  已跳过条目数量
#   {slots}  物品栏位数量
#   {source}  导入源或配置提供程序
#   {special}  特殊显示元素数量
#   {state}  当前状态
#   {style}  显示样式
#   {subject}  网页编辑会话的对象
#   {target}  应用语言选择的插件
#   {temporary}  临时对象数量
#   {text}  显示文本
#   {title}  显示标题
#   {to}  目标值或范围终点
#   {total}  条目总数
#   {type}  预期的值或对象类型
#   {url}  网址
#   {usage}  命令语法
#   {uuid}  对象或玩家的唯一标识符
#   {value}  当前消息或参数值
#   {variables}  消息允许的占位符
#   {variants}  显示变体数量或列表
#   {viewPermission}  查看所需权限
#   {viewRange}  最大可视距离
#   {warnings}  警告数量
#   {when}  显示条件
#   {world}  世界名称
#   {x}  X 坐标
#   {y}  Y 坐标
#   {yaw}  水平角度
#   {z}  Z 坐标

