# Gloss — zh_TW
#
# === 編輯檔案 ===
# plugins/Gloss/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /gloss language server edit zh_TW
#
# === 前綴 ===
# 前綴: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === 格式 ===
# 顏色: &0-&f, &k-&r, &#RRGGBB.
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {absorbed}  合併至現有資料的匯入項目數
#   {active}  作用中提供者數量
#   {actual}  目前修訂版本
#   {after}  編輯後的訊息值
#   {argument}  非預期的指令引數
#   {axis}  座標軸或旋轉軸
#   {bees}  容器內蜜蜂數量
#   {before}  編輯前的訊息值
#   {billboard}  顯示朝向模式
#   {blocks}  方塊顯示元素數量
#   {board}  看板或面板識別碼
#   {bottles}  容器內瓶子數量
#   {bubbles}  作用中聊天氣泡數量
#   {cells}  選單儲存格數量
#   {color}  顯示或物品顏色
#   {command}  指令路徑
#   {conflicts}  匯入衝突數量
#   {copied}  已複製項目數量
#   {count}  符合的物件或訊息數量
#   {disc}  容器內音樂唱片
#   {distance}  與目標的距離
#   {drops}  顯示的掉落物品數量
#   {enabled}  啟用狀態或已啟用項目數量
#   {entities}  實體數量
#   {error}  驗證或操作錯誤
#   {errors}  錯誤數量
#   {expected}  儲存編輯時的預期修訂版本
#   {experience}  獲得的經驗值
#   {failed}  失敗的操作數量
#   {from}  來源值或範圍起點
#   {fuel}  容器內剩餘燃料
#   {group}  語言編輯器類別
#   {hologram}  全像圖識別碼
#   {honey}  目前蜂蜜量
#   {id}  物件識別碼
#   {imported}  已匯入項目數量
#   {indicators}  傷害指示器數量
#   {interactPermission}  互動所需權限
#   {interactionRange}  最大互動距離
#   {item}  物品名稱或材質
#   {key}  訊息或設定鍵
#   {kind}  物件或提供者類型
#   {kinds}  可用的物件或提供者類型
#   {labels}  文字標籤數量
#   {legacy}  匯入來源中的識別碼
#   {level}  顯示等級
#   {limit}  允許的限制
#   {line}  訊息內的行號
#   {locale}  語言代碼
#   {maximum}  允許的最大值
#   {maximumBees}  蜜蜂數量上限
#   {maximumHoney}  蜂蜜量上限
#   {menu}  選單識別碼
#   {message}  回饋或診斷訊息
#   {migrated}  已轉換項目數量
#   {minimum}  允許的最小值
#   {mode}  所選操作或顯示模式
#   {name}  物件名稱
#   {oldBoard}  先前的看板識別碼
#   {operation}  操作名稱
#   {options}  可用的指令選項
#   {overlaid}  已套用設定鍵數量
#   {page}  目前頁碼
#   {pages}  總頁數
#   {panels}  面板數量
#   {parameter}  指令參數名稱
#   {path}  檔案或目錄路徑
#   {pending}  待發佈狀態
#   {percent}  百分比值
#   {permission}  所需權限
#   {personal}  個人語言代碼
#   {pitch}  垂直角度
#   {player}  玩家名稱
#   {plugin}  外掛名稱
#   {priority}  選擇或繪製優先順序
#   {provider}  提供者名稱
#   {providers}  提供者清單或數量
#   {radius}  搜尋半徑
#   {ready}  可匯入項目數量
#   {reason}  錯誤或決定的原因
#   {resume}  可繼續匯入的項目數量
#   {revision}  文件修訂版本
#   {roll}  翻滾角度
#   {rotation}  顯示旋轉
#   {scale}  顯示或預覽縮放比例
#   {seconds}  時間（秒）
#   {section}  語言編輯器區段
#   {session}  編輯工作階段識別碼
#   {severity}  診斷嚴重程度
#   {skipped}  已略過項目數量
#   {slots}  物品欄位數量
#   {source}  匯入來源或設定提供者
#   {special}  特殊顯示元素數量
#   {state}  目前狀態
#   {style}  顯示樣式
#   {subject}  網頁編輯工作階段的物件
#   {target}  套用語言選擇的外掛
#   {temporary}  暫存物件數量
#   {text}  顯示文字
#   {title}  顯示標題
#   {to}  目標值或範圍終點
#   {total}  項目總數
#   {type}  預期的值或物件類型
#   {url}  網址
#   {uuid}  物件或玩家的唯一識別碼
#   {value}  目前訊息或參數值
#   {variables}  訊息允許的預留位置
#   {variants}  顯示變體數量或清單
#   {viewPermission}  檢視所需權限
#   {viewRange}  最大可視距離
#   {warnings}  警告數量
#   {when}  顯示條件
#   {world}  世界名稱
#   {x}  X 座標
#   {y}  Y 座標
#   {yaw}  水平角度
#   {z}  Z 座標

