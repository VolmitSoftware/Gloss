# Gloss — ja-JP
#
# === ファイルの編集 ===
# plugins/Gloss/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /gloss language server edit ja-JP
#
# === 接頭辞 ===
# 接頭辞: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === 書式 ===
# 色: &0-&f, &k-&r, &#RRGGBB.
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {absorbed}  既存データに統合したインポート項目数
#   {active}  有効なプロバイダー数
#   {actual}  現在のリビジョン
#   {after}  編集後のメッセージ値
#   {argument}  予期しないコマンド引数
#   {axis}  座標軸または回転軸
#   {bees}  容器内のハチの数
#   {before}  編集前のメッセージ値
#   {billboard}  表示の向きの追従モード
#   {blocks}  ブロック表示要素数
#   {board}  ボードまたはパネルの識別子
#   {bottles}  容器内の瓶の数
#   {bubbles}  有効なチャット吹き出し数
#   {cells}  メニューのセル数
#   {color}  表示またはアイテムの色
#   {command}  コマンドのパス
#   {conflicts}  インポートの競合数
#   {copied}  コピーした項目数
#   {count}  一致するオブジェクトまたはメッセージ数
#   {disc}  容器内のレコード
#   {distance}  対象までの距離
#   {drops}  表示するドロップアイテム数
#   {enabled}  有効状態または有効な項目数
#   {entities}  エンティティ数
#   {error}  検証または操作のエラー
#   {errors}  エラー数
#   {expected}  編集保存時に期待するリビジョン
#   {experience}  獲得した経験値
#   {failed}  失敗した操作数
#   {from}  元の値または範囲の開始
#   {fuel}  容器に残っている燃料
#   {group}  言語エディターの分類
#   {hologram}  ホログラムの識別子
#   {honey}  現在のハチミツ量
#   {id}  オブジェクトの識別子
#   {imported}  インポートした項目数
#   {indicators}  ダメージ表示数
#   {interactPermission}  操作に必要な権限
#   {interactionRange}  操作できる最大距離
#   {item}  アイテム名または素材
#   {key}  メッセージまたは設定のキー
#   {kind}  オブジェクトまたはプロバイダーの種類
#   {kinds}  使用可能なオブジェクトまたはプロバイダーの種類
#   {labels}  テキストラベル数
#   {legacy}  インポート元の識別子
#   {level}  表示するレベル
#   {limit}  許容上限
#   {line}  メッセージ内の行番号
#   {locale}  言語コード
#   {maximum}  許容最大値
#   {maximumBees}  ハチの最大数
#   {maximumHoney}  ハチミツ量の上限
#   {menu}  メニューの識別子
#   {message}  応答または診断のメッセージ
#   {migrated}  変換した項目数
#   {minimum}  許容最小値
#   {mode}  選択した操作または表示モード
#   {name}  オブジェクト名
#   {oldBoard}  以前のボード識別子
#   {operation}  操作名
#   {options}  使用可能なコマンドオプション
#   {overlaid}  適用した設定キー数
#   {page}  現在のページ番号
#   {pages}  総ページ数
#   {panels}  パネル数
#   {parameter}  コマンドパラメーター名
#   {path}  ファイルまたはフォルダーのパス
#   {pending}  保留中の公開状態
#   {percent}  割合の値
#   {permission}  必要な権限
#   {personal}  個人の言語コード
#   {pitch}  垂直角度
#   {player}  プレイヤー名
#   {plugin}  プラグイン名
#   {priority}  選択または描画の優先度
#   {provider}  プロバイダー名
#   {providers}  プロバイダーの一覧または数
#   {radius}  検索半径
#   {ready}  インポート可能な項目数
#   {reason}  エラーまたは判断の理由
#   {resume}  インポートを再開できる項目数
#   {revision}  文書のリビジョン
#   {roll}  ロール角度
#   {rotation}  表示の回転
#   {scale}  表示またはプレビューの倍率
#   {seconds}  時間（秒）
#   {session}  編集セッションの識別子
#   {severity}  診断の重大度
#   {skipped}  スキップした項目数
#   {slots}  アイテムスロット数
#   {source}  インポート元または設定プロバイダー
#   {special}  特殊表示要素数
#   {state}  現在の状態
#   {style}  表示スタイル
#   {subject}  Webエディターで編集する対象
#   {target}  言語選択を適用するプラグイン
#   {temporary}  一時オブジェクト数
#   {text}  表示するテキスト
#   {title}  表示するタイトル
#   {to}  変更先の値または範囲の終了
#   {total}  総項目数
#   {type}  期待する値またはオブジェクトの種類
#   {url}  Webアドレス
#   {usage}  コマンド構文
#   {uuid}  オブジェクトまたはプレイヤーの一意な識別子
#   {value}  現在のメッセージまたはパラメーター値
#   {variables}  メッセージで使用可能な変数
#   {variants}  表示バリエーションの数または一覧
#   {viewPermission}  表示に必要な権限
#   {viewRange}  最大表示距離
#   {warnings}  警告数
#   {when}  表示条件
#   {world}  ワールド名
#   {x}  X座標
#   {y}  Y座標
#   {yaw}  水平角度
#   {z}  Z座標

