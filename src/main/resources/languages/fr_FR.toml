# Gloss — fr_FR
#
# === Modifier le fichier ===
# plugins/Gloss/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /gloss language server edit fr_FR
#
# === Préfixe ===
# Le préfixe &8[&dGloss&8] est écrit directement dans les messages ; modifiez-le dans chaque message concerné.
#
# === Mise en forme ===
# Couleurs: &0-&f, &k-&r, &#RRGGBB.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {absorbed}  Entrées importées fusionnées avec les données existantes
#   {active}  Nombre de fournisseurs actifs
#   {actual}  Révision actuelle
#   {after}  Valeur du message après modification
#   {argument}  Argument de commande inattendu
#   {axis}  Axe de coordonnées ou de rotation
#   {bees}  Nombre d’abeilles dans le conteneur
#   {before}  Valeur du message avant modification
#   {billboard}  Mode d’orientation de l’affichage
#   {blocks}  Nombre d’éléments d’affichage de blocs
#   {board}  Identifiant du tableau ou du panneau
#   {bottles}  Nombre de bouteilles dans le conteneur
#   {bubbles}  Nombre de bulles de discussion actives
#   {cells}  Nombre de cellules du menu
#   {color}  Couleur de l’affichage ou de l’objet
#   {command}  Chemin de la commande
#   {conflicts}  Nombre de conflits d’importation
#   {copied}  Nombre d’entrées copiées
#   {count}  Nombre d’objets ou de messages correspondants
#   {disc}  Disque de musique dans le conteneur
#   {distance}  Distance jusqu’à la cible
#   {drops}  Nombre d’objets au sol affichés
#   {enabled}  État d’activation ou nombre d’entrées activées
#   {entities}  Nombre d’entités
#   {error}  Erreur de validation ou d’opération
#   {errors}  Nombre d’erreurs
#   {expected}  Révision attendue lors de l’enregistrement
#   {experience}  Quantité d’expérience gagnée
#   {failed}  Nombre d’opérations échouées
#   {from}  Valeur source ou début d’un intervalle
#   {fuel}  Combustible restant dans le conteneur
#   {group}  Catégorie de l’éditeur de langue
#   {hologram}  Identifiant de l’hologramme
#   {honey}  Niveau de miel actuel
#   {id}  Identifiant de l’objet
#   {imported}  Nombre d’entrées importées
#   {indicators}  Nombre d’indicateurs de dégâts
#   {interactPermission}  Permission nécessaire pour interagir
#   {interactionRange}  Distance maximale d’interaction
#   {item}  Nom ou matériau de l’objet
#   {key}  Clé de message ou de configuration
#   {kind}  Type d’objet ou de fournisseur
#   {kinds}  Types d’objets ou de fournisseurs disponibles
#   {labels}  Nombre d’étiquettes textuelles
#   {legacy}  Identifiant de la source d’importation
#   {level}  Niveau affiché
#   {limit}  Limite autorisée
#   {line}  Numéro de ligne dans le message
#   {locale}  Code de langue
#   {maximum}  Valeur maximale autorisée
#   {maximumBees}  Nombre maximal d’abeilles
#   {maximumHoney}  Niveau maximal de miel
#   {menu}  Identifiant du menu
#   {message}  Message de retour ou de diagnostic
#   {migrated}  Nombre d’entrées converties
#   {minimum}  Valeur minimale autorisée
#   {mode}  Mode d’opération ou d’affichage choisi
#   {name}  Nom de l’objet
#   {oldBoard}  Identifiant du tableau précédent
#   {operation}  Nom de l’opération
#   {options}  Options de commande disponibles
#   {overlaid}  Nombre de clés de configuration appliquées
#   {page}  Numéro de la page actuelle
#   {pages}  Nombre total de pages
#   {panels}  Nombre de panneaux
#   {parameter}  Nom du paramètre de commande
#   {path}  Chemin du fichier ou du dossier
#   {pending}  État des modifications en attente de publication
#   {percent}  Valeur en pourcentage
#   {permission}  Permission requise
#   {personal}  Code de langue personnel
#   {pitch}  Angle vertical en degrés
#   {player}  Nom du joueur
#   {plugin}  Nom du plugin
#   {priority}  Priorité de sélection ou de rendu
#   {provider}  Nom du fournisseur
#   {providers}  Liste ou nombre de fournisseurs
#   {radius}  Rayon de recherche
#   {ready}  Nombre d’entrées prêtes à importer
#   {reason}  Motif de l’erreur ou de la décision
#   {resume}  Nombre d’entrées dont l’importation peut reprendre
#   {revision}  Révision du document
#   {roll}  Angle de roulis en degrés
#   {rotation}  Rotation de l’affichage
#   {scale}  Échelle de l’affichage ou de l’aperçu
#   {seconds}  Durée en secondes
#   {section}  Section affichée dans l’éditeur de langue
#   {session}  Identifiant de la session d’édition
#   {severity}  Gravité du diagnostic
#   {skipped}  Nombre d’entrées ignorées
#   {slots}  Nombre d’emplacements d’objets
#   {source}  Source d’importation ou fournisseur de configuration
#   {special}  Nombre d’éléments d’affichage spéciaux
#   {state}  État actuel
#   {style}  Style d’affichage
#   {subject}  Objet de la session de l’éditeur web
#   {target}  Plugin recevant la sélection de langue
#   {temporary}  Nombre d’objets temporaires
#   {text}  Texte affiché
#   {title}  Titre affiché
#   {to}  Valeur cible ou fin d’un intervalle
#   {total}  Nombre total d’entrées
#   {type}  Type de valeur ou d’objet attendu
#   {url}  Adresse web
#   {usage}  Syntaxe de la commande
#   {uuid}  Identifiant unique de l’objet ou du joueur
#   {value}  Valeur actuelle du message ou du paramètre
#   {variables}  Variables autorisées dans le message
#   {variants}  Nombre ou liste de variantes d’affichage
#   {viewPermission}  Permission nécessaire pour voir
#   {viewRange}  Distance maximale de visibilité
#   {warnings}  Nombre d’avertissements
#   {when}  Condition d’affichage
#   {world}  Nom du monde
#   {x}  Coordonnée X
#   {y}  Coordonnée Y
#   {yaw}  Angle horizontal en degrés
#   {z}  Coordonnée Z

