# Gloss — es_ES
#
# === Editar el archivo ===
# plugins/Gloss/languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /gloss language server edit es_ES
#
# === Prefijo ===
# El prefijo &8[&dGloss&8] está escrito directamente en los mensajes; edítalo en cada mensaje correspondiente.
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB.
#
# === Variables ===
# Mantenga los nombres de las variables y use solo las que ya contiene cada mensaje.
#   {absorbed}  Entradas absorbidas
#   {active}  Proveedores activos
#   {actual}  Revisión actual
#   {after}  Valor después del cambio
#   {argument}  Argumento del comando
#   {axis}  Eje de rotación
#   {bees}  Número de abejas
#   {before}  Valor antes del cambio
#   {billboard}  Modo de orientación hacia el jugador
#   {blocks}  Número de bloques
#   {board}  Identificador del panel o marcador
#   {bottles}  Número de frascos
#   {bubbles}  Número de burbujas de chat
#   {cells}  Número de celdas
#   {color}  Color del objeto
#   {command}  Comando o ruta del comando
#   {conflicts}  Número de conflictos
#   {copied}  Entradas copiadas
#   {count}  Número de elementos
#   {disc}  Disco cargado
#   {distance}  Distancia en bloques
#   {drops}  Número de indicadores de objetos caídos
#   {enabled}  Número de elementos activados
#   {entities}  Número de entidades
#   {error}  Detalle del error
#   {errors}  Número de errores
#   {expected}  Revisión esperada
#   {experience}  Experiencia ganada
#   {failed}  Número de fallos
#   {from}  Primer elemento mostrado
#   {fuel}  Combustible restante
#   {group}  Categoría de mensajes
#   {hologram}  Identificador del holograma
#   {honey}  Nivel de miel
#   {id}  Identificador del objeto gestionado
#   {imported}  Entradas importadas
#   {indicators}  Número de indicadores de daño
#   {interactPermission}  Permiso de interacción
#   {interactionRange}  Distancia máxima de interacción
#   {item}  Objeto en procesamiento
#   {key}  Clave del mensaje o parámetro
#   {kind}  Tipo de documento o valor predeterminado
#   {kinds}  Tipos de archivo modificados
#   {labels}  Número de etiquetas
#   {legacy}  Identificador en la fuente importada
#   {level}  Nivel actual del contenido
#   {limit}  Límite absoluto permitido
#   {line}  Número de línea
#   {locale}  Identificador del idioma
#   {maximum}  Valor o capacidad máxima
#   {maximumBees}  Capacidad máxima de abejas
#   {maximumHoney}  Nivel máximo de miel
#   {menu}  Identificador del menú
#   {message}  Texto del mensaje
#   {migrated}  Entradas migradas
#   {minimum}  Valor mínimo permitido
#   {mode}  Modo de visibilidad o seguimiento
#   {name}  Nombre del objeto o documento
#   {oldBoard}  Identificador anterior del panel
#   {operation}  Operación realizada
#   {options}  Valores permitidos
#   {overlaid}  Claves de configuración importadas
#   {page}  Página actual
#   {pages}  Número de páginas
#   {panels}  Número de paneles
#   {parameter}  Nombre del parámetro
#   {path}  Ruta del archivo o fuente
#   {pending}  Estado de los cambios pendientes
#   {percent}  Progreso en porcentaje
#   {permission}  Permiso necesario
#   {personal}  Idioma personal
#   {pitch}  Rotación vertical
#   {player}  Nombre del jugador
#   {plugin}  Nombre del plugin
#   {priority}  Prioridad de selección
#   {provider}  Nombre del proveedor de objetos
#   {providers}  Número de proveedores
#   {radius}  Radio de búsqueda en bloques
#   {ready}  Entradas listas para importar
#   {reason}  Motivo del resultado o fallo
#   {resume}  Entradas cuya migración puede reanudarse
#   {revision}  Revisión del documento
#   {roll}  Rotación sobre el eje de visión
#   {rotation}  Modo de rotación durante el seguimiento
#   {scale}  Escala de visualización
#   {seconds}  Duración o plazo en segundos
#   {section}  Sección mostrada en el editor de idiomas
#   {session}  Identificador de la sesión de edición
#   {severity}  Gravedad del problema
#   {skipped}  Entradas omitidas
#   {slots}  Número de ranuras
#   {source}  Fuente de copia o importación
#   {special}  Número de elementos especiales
#   {state}  Estado del panel o importación
#   {style}  Nombre del estilo de burbuja
#   {subject}  Identificador del documento editado
#   {target}  Plugin al que aplicar el idioma
#   {temporary}  Número de hologramas temporales
#   {text}  Contenido de la línea
#   {title}  Título del marcador
#   {to}  Último elemento mostrado
#   {total}  Número total de elementos
#   {type}  Tipo del parámetro
#   {url}  Dirección web
#   {usage}  Sintaxis del comando
#   {uuid}  Identificador UUID completo
#   {value}  Valor actual, predeterminado o introducido
#   {variables}  Variables del mensaje
#   {variants}  Variantes del marcador
#   {viewPermission}  Permiso de visibilidad
#   {viewRange}  Distancia máxima de visibilidad
#   {warnings}  Número de advertencias
#   {when}  Condición de selección
#   {world}  Nombre del mundo
#   {x}  Coordenada X
#   {y}  Coordenada Y
#   {yaw}  Rotación horizontal
#   {z}  Coordenada Z

