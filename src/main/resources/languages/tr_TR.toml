# Gloss — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/Gloss/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /gloss language server edit tr_TR
#
# === Önek ===
# &8[&dGloss&8] öneki her iletinin içindedir: ilgili iletilerde ayrı ayrı düzenleyin.
#
# === Biçimlendirme ===
# Renkler: &0-&f, &k-&r, &#RRGGBB.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {absorbed}  Mevcut verilerle birleştirilen içe aktarılmış kayıtlar
#   {active}  Etkin sağlayıcı sayısı
#   {actual}  Geçerli belge sürümü
#   {after}  Düzenlemeden sonraki ileti değeri
#   {argument}  Beklenmeyen komut argümanı
#   {axis}  Koordinat veya dönüş ekseni
#   {bees}  Kaptaki arı sayısı
#   {before}  Düzenlemeden önceki ileti değeri
#   {billboard}  Görüntülenen nesnenin bakış yönü modu
#   {blocks}  Blok gösterim öğesi sayısı
#   {board}  Pano veya panel kimliği
#   {bottles}  Kaptaki şişe sayısı
#   {bubbles}  Etkin sohbet balonu sayısı
#   {cells}  Menü hücresi sayısı
#   {color}  Görüntülenen nesnenin veya eşyanın rengi
#   {command}  Komut yolu
#   {conflicts}  İçe aktarma çakışması sayısı
#   {copied}  Kopyalanan kayıt sayısı
#   {count}  Eşleşen nesne veya ileti sayısı
#   {disc}  Kaptaki müzik diski
#   {distance}  Hedefe uzaklık
#   {drops}  Görüntülenen düşmüş eşya sayısı
#   {enabled}  Etkinlik durumu veya etkin kayıt sayısı
#   {entities}  Varlık sayısı
#   {error}  Doğrulama veya işlem hatası
#   {errors}  Hata sayısı
#   {expected}  Düzenleme kaydedilirken beklenen sürüm
#   {experience}  Kazanılan deneyim
#   {failed}  Başarısız işlem sayısı
#   {from}  Kaynak değer veya aralığın başlangıcı
#   {fuel}  Kapta kalan yakıt
#   {group}  Dil düzenleyicisi kategorisi
#   {hologram}  Hologram kimliği
#   {honey}  Geçerli bal seviyesi
#   {id}  Nesne kimliği
#   {imported}  İçe aktarılan kayıt sayısı
#   {indicators}  Hasar göstergesi sayısı
#   {interactPermission}  Etkileşim için gereken izin
#   {interactionRange}  En yüksek etkileşim uzaklığı
#   {item}  Eşya adı veya malzemesi
#   {key}  İleti veya yapılandırma anahtarı
#   {kind}  Nesne veya sağlayıcı türü
#   {kinds}  Kullanılabilir nesne veya sağlayıcı türleri
#   {labels}  Metin etiketi sayısı
#   {legacy}  İçe aktarma kaynağındaki kimlik
#   {level}  Görüntülenen seviye
#   {limit}  İzin verilen sınır
#   {line}  İletideki satır numarası
#   {locale}  Dil kodu
#   {maximum}  İzin verilen en yüksek değer
#   {maximumBees}  En yüksek arı sayısı
#   {maximumHoney}  En yüksek bal seviyesi
#   {menu}  Menü kimliği
#   {message}  Geri bildirim veya tanılama iletisi
#   {migrated}  Dönüştürülen kayıt sayısı
#   {minimum}  İzin verilen en düşük değer
#   {mode}  Seçilen işlem veya görüntüleme modu
#   {name}  Nesne adı
#   {oldBoard}  Önceki pano kimliği
#   {operation}  İşlem adı
#   {options}  Kullanılabilir komut seçenekleri
#   {overlaid}  Uygulanan yapılandırma anahtarı sayısı
#   {page}  Geçerli sayfa numarası
#   {pages}  Toplam sayfa sayısı
#   {panels}  Panel sayısı
#   {parameter}  Komut parametresinin adı
#   {path}  Dosya veya dizin yolu
#   {pending}  Bekleyen yayımlamanın durumu
#   {percent}  Yüzde değeri
#   {permission}  Gereken izin
#   {personal}  Kişisel dil kodu
#   {pitch}  Derece cinsinden dikey açı
#   {player}  Oyuncu adı
#   {plugin}  Eklenti adı
#   {priority}  Seçim veya görüntüleme önceliği
#   {provider}  Sağlayıcı adı
#   {providers}  Sağlayıcı listesi veya sayısı
#   {radius}  Arama yarıçapı
#   {ready}  İçe aktarılmaya hazır kayıt sayısı
#   {reason}  Hatanın veya kararın nedeni
#   {resume}  İçe aktarımı sürdürülebilecek kayıt sayısı
#   {revision}  Belge sürümü
#   {roll}  Derece cinsinden yatış açısı
#   {rotation}  Görüntülenen nesnenin dönüşü
#   {scale}  Görüntüleme veya önizleme ölçeği
#   {seconds}  Saniye cinsinden süre
#   {section}  Dil düzenleyicisi bölümü
#   {session}  Düzenleyici oturum kimliği
#   {severity}  Tanılama iletisinin önem düzeyi
#   {skipped}  Atlanan kayıt sayısı
#   {slots}  Eşya yuvası sayısı
#   {source}  İçe aktarma kaynağı veya yapılandırma sağlayıcısı
#   {special}  Özel gösterim öğesi sayısı
#   {state}  Geçerli durum
#   {style}  Görüntüleme stili
#   {subject}  Web düzenleyicisi oturumunun konusu
#   {target}  Dil seçiminin uygulanacağı eklenti
#   {temporary}  Geçici nesne sayısı
#   {text}  Görüntülenen metin
#   {title}  Görüntülenen başlık
#   {to}  Hedef değer veya aralığın sonu
#   {total}  Toplam kayıt sayısı
#   {type}  Beklenen değer veya nesne türü
#   {url}  Web adresi
#   {uuid}  Benzersiz nesne veya oyuncu kimliği
#   {value}  İletinin veya parametrenin geçerli değeri
#   {variables}  İletide izin verilen değişkenler
#   {variants}  Görüntüleme çeşidi sayısı veya listesi
#   {viewPermission}  Görmek için gereken izin
#   {viewRange}  En yüksek görüş uzaklığı
#   {warnings}  Uyarı sayısı
#   {when}  Görüntüleme koşulu
#   {world}  Dünya adı
#   {x}  X koordinatı
#   {y}  Y koordinatı
#   {yaw}  Derece cinsinden yatay açı
#   {z}  Z koordinatı

