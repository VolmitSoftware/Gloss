# Gloss — pl_PL
#
# === Edycja pliku ===
# plugins/Gloss/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /gloss language server edit pl_PL
#
# === Prefiks ===
# Prefiks &8[&dGloss&8] jest częścią każdej wiadomości: zmieniaj go w odpowiednich wiadomościach.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {absorbed}  Zaimportowane wpisy połączone z istniejącymi danymi
#   {active}  Liczba aktywnych dostawców
#   {actual}  Bieżąca wersja dokumentu
#   {after}  Treść wiadomości po edycji
#   {argument}  Nieoczekiwany argument polecenia
#   {axis}  Oś współrzędnych lub obrotu
#   {bees}  Liczba pszczół w pojemniku
#   {before}  Treść wiadomości przed edycją
#   {billboard}  Tryb orientacji wyświetlanego obiektu
#   {blocks}  Liczba elementów wyświetlających bloki
#   {board}  Identyfikator tablicy lub panelu
#   {bottles}  Liczba butelek w pojemniku
#   {bubbles}  Liczba aktywnych dymków czatu
#   {cells}  Liczba komórek menu
#   {color}  Kolor wyświetlanego obiektu lub przedmiotu
#   {command}  Ścieżka polecenia
#   {conflicts}  Liczba konfliktów importu
#   {copied}  Liczba skopiowanych wpisów
#   {count}  Liczba pasujących obiektów lub wiadomości
#   {disc}  Płyta muzyczna w pojemniku
#   {distance}  Odległość do celu
#   {drops}  Liczba wyświetlanych upuszczonych przedmiotów
#   {enabled}  Stan włączenia lub liczba włączonych wpisów
#   {entities}  Liczba bytów
#   {error}  Błąd walidacji lub operacji
#   {errors}  Liczba błędów
#   {expected}  Wersja oczekiwana przy zapisywaniu zmiany
#   {experience}  Zdobyte doświadczenie
#   {failed}  Liczba nieudanych operacji
#   {from}  Wartość źródłowa lub początek zakresu
#   {fuel}  Pozostałe paliwo w pojemniku
#   {group}  Kategoria edytora języka
#   {hologram}  Identyfikator hologramu
#   {honey}  Bieżący poziom miodu
#   {id}  Identyfikator obiektu
#   {imported}  Liczba zaimportowanych wpisów
#   {indicators}  Liczba wskaźników obrażeń
#   {interactPermission}  Uprawnienie wymagane do interakcji
#   {interactionRange}  Maksymalna odległość interakcji
#   {item}  Nazwa lub materiał przedmiotu
#   {key}  Klucz wiadomości lub ustawienia
#   {kind}  Typ obiektu lub dostawcy
#   {kinds}  Dostępne typy obiektów lub dostawców
#   {labels}  Liczba etykiet tekstowych
#   {legacy}  Identyfikator w źródle importu
#   {level}  Wyświetlany poziom
#   {limit}  Dopuszczalny limit
#   {line}  Numer wiersza w wiadomości
#   {locale}  Kod języka
#   {maximum}  Maksymalna dopuszczalna wartość
#   {maximumBees}  Maksymalna liczba pszczół
#   {maximumHoney}  Maksymalny poziom miodu
#   {menu}  Identyfikator menu
#   {message}  Komunikat zwrotny lub diagnostyczny
#   {migrated}  Liczba przekonwertowanych wpisów
#   {minimum}  Minimalna dopuszczalna wartość
#   {mode}  Wybrany tryb działania lub wyświetlania
#   {name}  Nazwa obiektu
#   {oldBoard}  Poprzedni identyfikator tablicy
#   {operation}  Nazwa operacji
#   {options}  Dostępne opcje polecenia
#   {overlaid}  Liczba zastosowanych kluczy konfiguracji
#   {page}  Numer bieżącej strony
#   {pages}  Łączna liczba stron
#   {panels}  Liczba paneli
#   {parameter}  Nazwa parametru polecenia
#   {path}  Ścieżka pliku lub katalogu
#   {pending}  Stan oczekującej publikacji
#   {percent}  Wartość procentowa
#   {permission}  Wymagane uprawnienie
#   {personal}  Kod osobistego języka
#   {pitch}  Kąt pionowy w stopniach
#   {player}  Nazwa gracza
#   {plugin}  Nazwa wtyczki
#   {priority}  Priorytet wyboru lub renderowania
#   {provider}  Nazwa dostawcy
#   {providers}  Lista lub liczba dostawców
#   {radius}  Promień wyszukiwania
#   {ready}  Liczba wpisów gotowych do importu
#   {reason}  Przyczyna błędu lub decyzji
#   {resume}  Liczba wpisów, których import można wznowić
#   {revision}  Wersja dokumentu
#   {roll}  Kąt przechylenia w stopniach
#   {rotation}  Obrót wyświetlanego obiektu
#   {scale}  Skala wyświetlania lub podglądu
#   {seconds}  Czas w sekundach
#   {session}  Identyfikator sesji edytora
#   {severity}  Poziom ważności komunikatu diagnostycznego
#   {skipped}  Liczba pominiętych wpisów
#   {slots}  Liczba miejsc na przedmioty
#   {source}  Źródło importu lub dostawca konfiguracji
#   {special}  Liczba specjalnych elementów wyświetlania
#   {state}  Bieżący stan
#   {style}  Styl wyświetlania
#   {subject}  Przedmiot sesji edytora internetowego
#   {target}  Wtyczka, dla której wybierany jest język
#   {temporary}  Liczba obiektów tymczasowych
#   {text}  Wyświetlany tekst
#   {title}  Wyświetlany tytuł
#   {to}  Wartość docelowa lub koniec zakresu
#   {total}  Łączna liczba wpisów
#   {type}  Oczekiwany typ wartości lub obiektu
#   {url}  Adres internetowy
#   {usage}  Składnia polecenia
#   {uuid}  Unikalny identyfikator obiektu lub gracza
#   {value}  Bieżąca wartość wiadomości lub parametru
#   {variables}  Dozwolone zmienne wiadomości
#   {variants}  Liczba lub lista wariantów wyświetlania
#   {viewPermission}  Uprawnienie wymagane do wyświetlania
#   {viewRange}  Maksymalna odległość widoczności
#   {warnings}  Liczba ostrzeżeń
#   {when}  Warunek wyświetlania
#   {world}  Nazwa świata
#   {x}  Współrzędna X
#   {y}  Współrzędna Y
#   {yaw}  Kąt poziomy w stopniach
#   {z}  Współrzędna Z

