# Gloss — pt_PT
#
# === Editar o ficheiro ===
# plugins/Gloss/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /gloss language server edit pt_PT
#
# === Prefixo ===
# O prefixo &8[&dGloss&8] faz parte de cada mensagem: altera-o nas mensagens correspondentes.
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {absorbed}  Entradas importadas fundidas com os dados existentes
#   {active}  Número de fornecedores ativos
#   {actual}  Revisão atual
#   {after}  Valor da mensagem após a edição
#   {argument}  Argumento de comando inesperado
#   {axis}  Eixo de coordenadas ou de rotação
#   {bees}  Número de abelhas no recipiente
#   {before}  Valor da mensagem antes da edição
#   {billboard}  Modo de orientação do elemento visual
#   {blocks}  Número de elementos visuais de blocos
#   {board}  Identificador do quadro ou painel
#   {bottles}  Número de frascos no recipiente
#   {bubbles}  Número de balões de conversa ativos
#   {cells}  Número de células do menu
#   {color}  Cor do elemento visual ou do item
#   {command}  Caminho do comando
#   {conflicts}  Número de conflitos de importação
#   {copied}  Número de entradas copiadas
#   {count}  Número de objetos ou mensagens correspondentes
#   {disc}  Disco de música no recipiente
#   {distance}  Distância até ao alvo
#   {drops}  Número de itens largados apresentados
#   {enabled}  Estado de ativação ou número de entradas ativas
#   {entities}  Número de entidades
#   {error}  Erro de validação ou da operação
#   {errors}  Número de erros
#   {expected}  Revisão esperada ao guardar a edição
#   {experience}  Quantidade de experiência ganha
#   {failed}  Número de operações falhadas
#   {from}  Valor de origem ou início de um intervalo
#   {fuel}  Combustível restante no recipiente
#   {group}  Categoria do editor de idioma
#   {hologram}  Identificador do holograma
#   {honey}  Nível atual de mel
#   {id}  Identificador do objeto
#   {imported}  Número de entradas importadas
#   {indicators}  Número de indicadores de dano
#   {interactPermission}  Permissão necessária para interagir
#   {interactionRange}  Distância máxima de interação
#   {item}  Nome ou material do item
#   {key}  Chave da mensagem ou da configuração
#   {kind}  Tipo de objeto ou fornecedor
#   {kinds}  Tipos de objetos ou fornecedores disponíveis
#   {labels}  Número de etiquetas de texto
#   {legacy}  Identificador da origem da importação
#   {level}  Nível apresentado
#   {limit}  Limite permitido
#   {line}  Número da linha na mensagem
#   {locale}  Código do idioma
#   {maximum}  Valor máximo permitido
#   {maximumBees}  Número máximo de abelhas
#   {maximumHoney}  Nível máximo de mel
#   {menu}  Identificador do menu
#   {message}  Mensagem de resposta ou diagnóstico
#   {migrated}  Número de entradas convertidas
#   {minimum}  Valor mínimo permitido
#   {mode}  Modo de operação ou apresentação selecionado
#   {name}  Nome do objeto
#   {oldBoard}  Identificador do quadro anterior
#   {operation}  Nome da operação
#   {options}  Opções de comando disponíveis
#   {overlaid}  Número de chaves de configuração aplicadas
#   {page}  Número da página atual
#   {pages}  Número total de páginas
#   {panels}  Número de painéis
#   {parameter}  Nome do parâmetro do comando
#   {path}  Caminho do ficheiro ou diretório
#   {pending}  Estado das alterações pendentes de publicação
#   {percent}  Valor percentual
#   {permission}  Permissão necessária
#   {personal}  Código do idioma pessoal
#   {pitch}  Ângulo vertical em graus
#   {player}  Nome do jogador
#   {plugin}  Nome do plugin
#   {priority}  Prioridade de seleção ou apresentação
#   {provider}  Nome do fornecedor
#   {providers}  Lista ou número de fornecedores
#   {radius}  Raio de pesquisa
#   {ready}  Número de entradas prontas a importar
#   {reason}  Motivo do erro ou da decisão
#   {resume}  Número de entradas cuja importação pode ser retomada
#   {revision}  Revisão do documento
#   {roll}  Ângulo de rotação longitudinal em graus
#   {rotation}  Rotação do elemento visual
#   {scale}  Escala do elemento visual ou da pré-visualização
#   {seconds}  Tempo em segundos
#   {section}  Secção apresentada no editor de idiomas
#   {session}  Identificador da sessão do editor
#   {severity}  Gravidade do diagnóstico
#   {skipped}  Número de entradas ignoradas
#   {slots}  Número de espaços para itens
#   {source}  Origem da importação ou fornecedor da configuração
#   {special}  Número de elementos visuais especiais
#   {state}  Estado atual
#   {style}  Estilo de apresentação
#   {subject}  Objeto da sessão do editor web
#   {target}  Plugin que recebe a seleção do idioma
#   {temporary}  Número de objetos temporários
#   {text}  Texto apresentado
#   {title}  Título apresentado
#   {to}  Valor de destino ou fim de um intervalo
#   {total}  Número total de entradas
#   {type}  Tipo de valor ou objeto esperado
#   {url}  Endereço web
#   {usage}  Sintaxe do comando
#   {uuid}  Identificador único do objeto ou jogador
#   {value}  Valor atual da mensagem ou do parâmetro
#   {variables}  Variáveis permitidas na mensagem
#   {variants}  Número ou lista de variantes de apresentação
#   {viewPermission}  Permissão necessária para ver
#   {viewRange}  Distância máxima de visualização
#   {warnings}  Número de avisos
#   {when}  Condição de apresentação
#   {world}  Nome do mundo
#   {x}  Coordenada X
#   {y}  Coordenada Y
#   {yaw}  Ângulo horizontal em graus
#   {z}  Coordenada Z

