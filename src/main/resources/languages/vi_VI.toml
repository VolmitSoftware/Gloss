# Gloss — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/Gloss/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /gloss language server edit vi_VI
#
# === Tiền tố ===
# Tiền tố: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === Định dạng ===
# Màu sắc: &0-&f, &k-&r, &#RRGGBB.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {absorbed}  Số mục nhập đã gộp vào dữ liệu hiện có
#   {active}  Số nhà cung cấp đang hoạt động
#   {actual}  Phiên bản sửa đổi hiện tại
#   {after}  Giá trị thông báo sau khi sửa
#   {argument}  Đối số lệnh không mong đợi
#   {axis}  Trục tọa độ hoặc trục xoay
#   {bees}  Số ong trong vật chứa
#   {before}  Giá trị thông báo trước khi sửa
#   {billboard}  Chế độ hướng của phần hiển thị
#   {blocks}  Số thành phần hiển thị khối
#   {board}  Mã định danh bảng hoặc bảng điều khiển
#   {bottles}  Số chai trong vật chứa
#   {bubbles}  Số bong bóng trò chuyện đang hoạt động
#   {cells}  Số ô trong trình đơn
#   {color}  Màu hiển thị hoặc màu vật phẩm
#   {command}  Đường dẫn lệnh
#   {conflicts}  Số xung đột khi nhập
#   {copied}  Số mục đã sao chép
#   {count}  Số đối tượng hoặc thông báo khớp
#   {disc}  Đĩa nhạc trong vật chứa
#   {distance}  Khoảng cách tới mục tiêu
#   {drops}  Số vật phẩm rơi đang hiển thị
#   {enabled}  Trạng thái bật hoặc số mục đã bật
#   {entities}  Số thực thể
#   {error}  Lỗi xác thực hoặc thao tác
#   {errors}  Số lỗi
#   {expected}  Phiên bản sửa đổi dự kiến khi lưu
#   {experience}  Lượng kinh nghiệm nhận được
#   {failed}  Số thao tác thất bại
#   {from}  Giá trị nguồn hoặc đầu khoảng
#   {fuel}  Nhiên liệu còn lại trong vật chứa
#   {group}  Danh mục của trình sửa ngôn ngữ
#   {hologram}  Mã định danh ảnh nổi
#   {honey}  Mức mật ong hiện tại
#   {id}  Mã định danh đối tượng
#   {imported}  Số mục đã nhập
#   {indicators}  Số chỉ báo sát thương
#   {interactPermission}  Quyền cần để tương tác
#   {interactionRange}  Khoảng cách tương tác tối đa
#   {item}  Tên hoặc vật liệu của vật phẩm
#   {key}  Khóa thông báo hoặc cấu hình
#   {kind}  Loại đối tượng hoặc nhà cung cấp
#   {kinds}  Các loại đối tượng hoặc nhà cung cấp có sẵn
#   {labels}  Số nhãn văn bản
#   {legacy}  Mã định danh trong nguồn nhập
#   {level}  Cấp độ được hiển thị
#   {limit}  Giới hạn cho phép
#   {line}  Số dòng trong thông báo
#   {locale}  Mã ngôn ngữ
#   {maximum}  Giá trị tối đa cho phép
#   {maximumBees}  Số ong tối đa
#   {maximumHoney}  Mức mật ong tối đa
#   {menu}  Mã định danh trình đơn
#   {message}  Thông báo phản hồi hoặc chẩn đoán
#   {migrated}  Số mục đã chuyển đổi
#   {minimum}  Giá trị tối thiểu cho phép
#   {mode}  Chế độ thao tác hoặc hiển thị đã chọn
#   {name}  Tên đối tượng
#   {oldBoard}  Mã định danh bảng trước đó
#   {operation}  Tên thao tác
#   {options}  Các tùy chọn lệnh có sẵn
#   {overlaid}  Số khóa cấu hình đã áp dụng
#   {page}  Số trang hiện tại
#   {pages}  Tổng số trang
#   {panels}  Số bảng điều khiển
#   {parameter}  Tên tham số lệnh
#   {path}  Đường dẫn tệp hoặc thư mục
#   {pending}  Trạng thái xuất bản đang chờ
#   {percent}  Giá trị phần trăm
#   {permission}  Quyền cần thiết
#   {personal}  Mã ngôn ngữ cá nhân
#   {pitch}  Góc dọc tính bằng độ
#   {player}  Tên người chơi
#   {plugin}  Tên plugin
#   {priority}  Độ ưu tiên lựa chọn hoặc kết xuất
#   {provider}  Tên nhà cung cấp
#   {providers}  Danh sách hoặc số nhà cung cấp
#   {radius}  Bán kính tìm kiếm
#   {ready}  Số mục sẵn sàng nhập
#   {reason}  Lý do lỗi hoặc quyết định
#   {resume}  Số mục nhập có thể tiếp tục
#   {revision}  Phiên bản sửa đổi tài liệu
#   {roll}  Góc nghiêng quanh hướng nhìn tính bằng độ
#   {rotation}  Độ xoay phần hiển thị
#   {scale}  Tỷ lệ hiển thị hoặc xem trước
#   {seconds}  Thời gian tính bằng giây
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {session}  Mã định danh phiên chỉnh sửa
#   {severity}  Mức độ nghiêm trọng của chẩn đoán
#   {skipped}  Số mục đã bỏ qua
#   {slots}  Số ô vật phẩm
#   {source}  Nguồn nhập hoặc nhà cung cấp cấu hình
#   {special}  Số thành phần hiển thị đặc biệt
#   {state}  Trạng thái hiện tại
#   {style}  Kiểu hiển thị
#   {subject}  Đối tượng của phiên chỉnh sửa web
#   {target}  Plugin nhận lựa chọn ngôn ngữ
#   {temporary}  Số đối tượng tạm thời
#   {text}  Văn bản được hiển thị
#   {title}  Tiêu đề được hiển thị
#   {to}  Giá trị đích hoặc cuối khoảng
#   {total}  Tổng số mục
#   {type}  Loại giá trị hoặc đối tượng dự kiến
#   {url}  Địa chỉ web
#   {uuid}  Mã định danh duy nhất của đối tượng hoặc người chơi
#   {value}  Giá trị thông báo hoặc tham số hiện tại
#   {variables}  Các biến được phép dùng trong thông báo
#   {variants}  Số lượng hoặc danh sách biến thể hiển thị
#   {viewPermission}  Quyền cần để xem
#   {viewRange}  Khoảng cách xem tối đa
#   {warnings}  Số cảnh báo
#   {when}  Điều kiện hiển thị
#   {world}  Tên thế giới
#   {x}  Tọa độ X
#   {y}  Tọa độ Y
#   {yaw}  Góc ngang tính bằng độ
#   {z}  Tọa độ Z

