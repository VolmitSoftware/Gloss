# Gloss — it_IT
#
# === Modifica del file ===
# plugins/Gloss/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /gloss language server edit it_IT
#
# === Prefisso ===
# Il prefisso &8[&dGloss&8] fa parte di ogni messaggio: modificalo nei singoli messaggi.
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {absorbed}  Voci importate unite ai dati esistenti
#   {active}  Numero di fornitori attivi
#   {actual}  Revisione attuale
#   {after}  Valore del messaggio dopo la modifica
#   {argument}  Argomento di comando inatteso
#   {axis}  Asse delle coordinate o di rotazione
#   {bees}  Numero di api nel contenitore
#   {before}  Valore del messaggio prima della modifica
#   {billboard}  Modalità di orientamento dell’elemento visualizzato
#   {blocks}  Numero di elementi di visualizzazione dei blocchi
#   {board}  Identificatore della bacheca o del pannello
#   {bottles}  Numero di bottiglie nel contenitore
#   {bubbles}  Numero di fumetti della chat attivi
#   {cells}  Numero di celle del menu
#   {color}  Colore dell’elemento visualizzato o dell’oggetto
#   {command}  Percorso del comando
#   {conflicts}  Numero di conflitti d’importazione
#   {copied}  Numero di voci copiate
#   {count}  Numero di oggetti o messaggi corrispondenti
#   {disc}  Disco musicale nel contenitore
#   {distance}  Distanza dal bersaglio
#   {drops}  Numero di oggetti a terra visualizzati
#   {enabled}  Stato di attivazione o numero di voci attivate
#   {entities}  Numero di entità
#   {error}  Errore di convalida o dell’operazione
#   {errors}  Numero di errori
#   {expected}  Revisione attesa al salvataggio della modifica
#   {experience}  Quantità di esperienza guadagnata
#   {failed}  Numero di operazioni fallite
#   {from}  Valore di origine o inizio di un intervallo
#   {fuel}  Carburante rimanente nel contenitore
#   {group}  Categoria dell’editor di lingua
#   {hologram}  Identificatore dell’ologramma
#   {honey}  Livello attuale di miele
#   {id}  Identificatore dell’oggetto
#   {imported}  Numero di voci importate
#   {indicators}  Numero di indicatori di danno
#   {interactPermission}  Permesso necessario per interagire
#   {interactionRange}  Distanza massima di interazione
#   {item}  Nome o materiale dell’oggetto
#   {key}  Chiave del messaggio o della configurazione
#   {kind}  Tipo di oggetto o fornitore
#   {kinds}  Tipi di oggetti o fornitori disponibili
#   {labels}  Numero di etichette testuali
#   {legacy}  Identificatore dell’origine dell’importazione
#   {level}  Livello visualizzato
#   {limit}  Limite consentito
#   {line}  Numero di riga nel messaggio
#   {locale}  Codice della lingua
#   {maximum}  Valore massimo consentito
#   {maximumBees}  Numero massimo di api
#   {maximumHoney}  Livello massimo di miele
#   {menu}  Identificatore del menu
#   {message}  Messaggio di risposta o diagnostica
#   {migrated}  Numero di voci convertite
#   {minimum}  Valore minimo consentito
#   {mode}  Modalità operativa o di visualizzazione selezionata
#   {name}  Nome dell’oggetto
#   {oldBoard}  Identificatore della bacheca precedente
#   {operation}  Nome dell’operazione
#   {options}  Opzioni disponibili per il comando
#   {overlaid}  Numero di chiavi di configurazione applicate
#   {page}  Numero della pagina attuale
#   {pages}  Numero totale di pagine
#   {panels}  Numero di pannelli
#   {parameter}  Nome del parametro del comando
#   {path}  Percorso del file o della cartella
#   {pending}  Stato delle modifiche in attesa di pubblicazione
#   {percent}  Valore percentuale
#   {permission}  Permesso richiesto
#   {personal}  Codice della lingua personale
#   {pitch}  Angolo verticale in gradi
#   {player}  Nome del giocatore
#   {plugin}  Nome del plugin
#   {priority}  Priorità di selezione o rendering
#   {provider}  Nome del fornitore
#   {providers}  Elenco o numero di fornitori
#   {radius}  Raggio di ricerca
#   {ready}  Numero di voci pronte per l’importazione
#   {reason}  Motivo dell’errore o della decisione
#   {resume}  Numero di voci la cui importazione può riprendere
#   {revision}  Revisione del documento
#   {roll}  Angolo di rollio in gradi
#   {rotation}  Rotazione dell’elemento visualizzato
#   {scale}  Scala dell’elemento visualizzato o dell’anteprima
#   {seconds}  Tempo in secondi
#   {session}  Identificatore della sessione dell’editor
#   {severity}  Gravità della diagnostica
#   {skipped}  Numero di voci saltate
#   {slots}  Numero di slot per gli oggetti
#   {source}  Origine dell’importazione o fornitore della configurazione
#   {special}  Numero di elementi di visualizzazione speciali
#   {state}  Stato attuale
#   {style}  Stile di visualizzazione
#   {subject}  Oggetto della sessione dell’editor web
#   {target}  Plugin che riceve la selezione della lingua
#   {temporary}  Numero di oggetti temporanei
#   {text}  Testo visualizzato
#   {title}  Titolo visualizzato
#   {to}  Valore di destinazione o fine di un intervallo
#   {total}  Numero totale di voci
#   {type}  Tipo di valore o oggetto atteso
#   {url}  Indirizzo web
#   {usage}  Sintassi del comando
#   {uuid}  Identificatore univoco dell’oggetto o del giocatore
#   {value}  Valore attuale del messaggio o del parametro
#   {variables}  Segnaposto consentiti nel messaggio
#   {variants}  Numero o elenco delle varianti di visualizzazione
#   {viewPermission}  Permesso necessario per visualizzare
#   {viewRange}  Distanza massima di visualizzazione
#   {warnings}  Numero di avvisi
#   {when}  Condizione di visualizzazione
#   {world}  Nome del mondo
#   {x}  Coordinata X
#   {y}  Coordinata Y
#   {yaw}  Angolo orizzontale in gradi
#   {z}  Coordinata Z

