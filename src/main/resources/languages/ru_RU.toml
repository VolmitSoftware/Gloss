# Gloss — ru_RU
#
# === Редактирование файла ===
# plugins/Gloss/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /gloss language server edit ru_RU
#
# === Префикс ===
# Префикс: &8[&dGloss&8] / &8[&dGloss&8]:
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {absorbed}  Число импортированных записей, объединённых с существующими
#   {active}  Число активных поставщиков
#   {actual}  Текущая редакция
#   {after}  Значение сообщения после изменения
#   {argument}  Неожиданный аргумент команды
#   {axis}  Ось координат или вращения
#   {bees}  Число пчёл в контейнере
#   {before}  Значение сообщения до изменения
#   {billboard}  Режим ориентации отображения
#   {blocks}  Число элементов отображения блоков
#   {board}  Идентификатор доски или панели
#   {bottles}  Число бутылок в контейнере
#   {bubbles}  Число активных облачков чата
#   {cells}  Число ячеек меню
#   {color}  Цвет отображения или предмета
#   {command}  Путь команды
#   {conflicts}  Число конфликтов импорта
#   {copied}  Число скопированных записей
#   {count}  Число подходящих объектов или сообщений
#   {disc}  Музыкальная пластинка в контейнере
#   {distance}  Расстояние до цели
#   {drops}  Число отображаемых выпавших предметов
#   {enabled}  Состояние включения или число включённых записей
#   {entities}  Число сущностей
#   {error}  Ошибка проверки или операции
#   {errors}  Число ошибок
#   {expected}  Ожидаемая редакция при сохранении
#   {experience}  Количество полученного опыта
#   {failed}  Число неудачных операций
#   {from}  Исходное значение или начало диапазона
#   {fuel}  Оставшееся топливо в контейнере
#   {group}  Категория редактора переводов
#   {hologram}  Идентификатор голограммы
#   {honey}  Текущий уровень мёда
#   {id}  Идентификатор объекта
#   {imported}  Число импортированных записей
#   {indicators}  Число индикаторов урона
#   {interactPermission}  Разрешение для взаимодействия
#   {interactionRange}  Максимальная дальность взаимодействия
#   {item}  Название или материал предмета
#   {key}  Ключ сообщения или настройки
#   {kind}  Тип объекта или поставщика
#   {kinds}  Доступные типы объектов или поставщиков
#   {labels}  Число текстовых меток
#   {legacy}  Идентификатор в источнике импорта
#   {level}  Отображаемый уровень
#   {limit}  Допустимый предел
#   {line}  Номер строки в сообщении
#   {locale}  Код языка
#   {maximum}  Максимально допустимое значение
#   {maximumBees}  Максимальное число пчёл
#   {maximumHoney}  Максимальный уровень мёда
#   {menu}  Идентификатор меню
#   {message}  Сообщение обратной связи или диагностики
#   {migrated}  Число преобразованных записей
#   {minimum}  Минимально допустимое значение
#   {mode}  Выбранный режим работы или отображения
#   {name}  Название объекта
#   {oldBoard}  Идентификатор прежней доски
#   {operation}  Название операции
#   {options}  Доступные параметры команды
#   {overlaid}  Число применённых ключей настройки
#   {page}  Номер текущей страницы
#   {pages}  Общее число страниц
#   {panels}  Число панелей
#   {parameter}  Название параметра команды
#   {path}  Путь к файлу или каталогу
#   {pending}  Состояние ожидающей публикации
#   {percent}  Значение в процентах
#   {permission}  Требуемое разрешение
#   {personal}  Личный код языка
#   {pitch}  Вертикальный угол в градусах
#   {player}  Имя игрока
#   {plugin}  Название плагина
#   {priority}  Приоритет выбора или отрисовки
#   {provider}  Название поставщика
#   {providers}  Список или число поставщиков
#   {radius}  Радиус поиска
#   {ready}  Число записей, готовых к импорту
#   {reason}  Причина ошибки или решения
#   {resume}  Число записей с возобновляемым импортом
#   {revision}  Редакция документа
#   {roll}  Угол крена в градусах
#   {rotation}  Вращение отображения
#   {scale}  Масштаб отображения или предпросмотра
#   {seconds}  Время в секундах
#   {section}  Раздел редактора языков
#   {session}  Идентификатор сеанса редактора
#   {severity}  Уровень важности диагностики
#   {skipped}  Число пропущенных записей
#   {slots}  Число ячеек для предметов
#   {source}  Источник импорта или поставщик настроек
#   {special}  Число специальных элементов отображения
#   {state}  Текущее состояние
#   {style}  Стиль отображения
#   {subject}  Объект сеанса веб-редактора
#   {target}  Плагин, для которого выбирается язык
#   {temporary}  Число временных объектов
#   {text}  Отображаемый текст
#   {title}  Отображаемый заголовок
#   {to}  Конечное значение или конец диапазона
#   {total}  Общее число записей
#   {type}  Ожидаемый тип значения или объекта
#   {url}  Веб-адрес
#   {uuid}  Уникальный идентификатор объекта или игрока
#   {value}  Текущее значение сообщения или параметра
#   {variables}  Допустимые переменные сообщения
#   {variants}  Число или список вариантов отображения
#   {viewPermission}  Разрешение для просмотра
#   {viewRange}  Максимальная дальность просмотра
#   {warnings}  Число предупреждений
#   {when}  Условие отображения
#   {world}  Название мира
#   {x}  Координата X
#   {y}  Координата Y
#   {yaw}  Горизонтальный угол в градусах
#   {z}  Координата Z

