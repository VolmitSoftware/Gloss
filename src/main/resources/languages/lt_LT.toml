# Gloss — lt_LT
#
# === Failo redagavimas ===
# plugins/Gloss/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojama integruota anglų kalba.
# /gloss language server edit lt_LT
#
# === Priešdėlis ===
# Priešdėlis &8[&dGloss&8] yra kiekvieno pranešimo dalis: keiskite jį atitinkamuose pranešimuose.
#
# === Formatavimas ===
# Spalvos: &0-&f, &k-&r, &#RRGGBB.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {absorbed}  Importuoti įrašai, sujungti su esamais duomenimis
#   {active}  Aktyvių teikėjų skaičius
#   {actual}  Dabartinė versija
#   {after}  Pranešimo reikšmė po redagavimo
#   {argument}  Netikėtas komandos argumentas
#   {axis}  Koordinačių arba sukimo ašis
#   {bees}  Bičių skaičius talpykloje
#   {before}  Pranešimo reikšmė prieš redagavimą
#   {billboard}  Rodomo objekto orientavimo režimas
#   {blocks}  Blokų rodymo elementų skaičius
#   {board}  Lentos arba skydelio identifikatorius
#   {bottles}  Butelių skaičius talpykloje
#   {bubbles}  Aktyvių pokalbių burbulų skaičius
#   {cells}  Meniu langelių skaičius
#   {color}  Rodomo elemento arba daikto spalva
#   {command}  Komandos kelias
#   {conflicts}  Importavimo konfliktų skaičius
#   {copied}  Nukopijuotų įrašų skaičius
#   {count}  Atitinkančių objektų arba pranešimų skaičius
#   {disc}  Muzikos plokštelė talpykloje
#   {distance}  Atstumas iki tikslo
#   {drops}  Rodomų numestų daiktų skaičius
#   {enabled}  Įjungimo būsena arba įjungtų įrašų skaičius
#   {entities}  Esybių skaičius
#   {error}  Tikrinimo arba operacijos klaida
#   {errors}  Klaidų skaičius
#   {expected}  Išsaugant pakeitimą tikėtasi šios versijos
#   {experience}  Gautos patirties kiekis
#   {failed}  Nepavykusių operacijų skaičius
#   {from}  Pradinė reikšmė arba intervalo pradžia
#   {fuel}  Talpykloje likęs kuras
#   {group}  Kalbos redaktoriaus kategorija
#   {hologram}  Hologramos identifikatorius
#   {honey}  Dabartinis medaus lygis
#   {id}  Objekto identifikatorius
