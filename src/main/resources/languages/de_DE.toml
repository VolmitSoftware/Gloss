# Gloss — de_DE
#
# === Datei bearbeiten ===
# plugins/Gloss/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /gloss language server edit de_DE
#
# === Präfix ===
# Das Präfix &8[&dGloss&8] steht direkt in den Nachrichten; ändere es in jeder betroffenen Nachricht.
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {absorbed}  Übernommene Einträge
#   {active}  Aktive Anbieter
#   {actual}  Aktuelle Revision
#   {after}  Wert nach der Änderung
#   {argument}  Befehlsargument
#   {axis}  Drehachse
#   {bees}  Anzahl der Bienen
#   {before}  Wert vor der Änderung
#   {billboard}  Ausrichtungsmodus zum Spieler
#   {blocks}  Anzahl der Blöcke
#   {board}  Panel- oder Scoreboard-ID
#   {bottles}  Anzahl der Flaschen
#   {bubbles}  Anzahl der Sprechblasen
#   {cells}  Anzahl der Zellen
#   {color}  Farbe des Gegenstands
#   {command}  Befehl oder Befehlspfad
#   {conflicts}  Anzahl der Konflikte
#   {copied}  Kopierte Einträge
#   {count}  Anzahl der Einträge
#   {disc}  Eingelegte Schallplatte
#   {distance}  Entfernung in Blöcken
#   {drops}  Anzahl der Anzeigen fallengelassener Gegenstände
#   {enabled}  Anzahl aktivierter Einträge
#   {entities}  Anzahl der Entitäten
#   {error}  Fehlerbeschreibung
#   {errors}  Anzahl der Fehler
#   {expected}  Erwartete Revision
#   {experience}  Gewonnene Erfahrung
#   {failed}  Anzahl fehlgeschlagener Vorgänge
#   {from}  Erster angezeigter Eintrag
#   {fuel}  Verbleibender Brennstoff
#   {group}  Nachrichtenkategorie
#   {hologram}  Hologramm-ID
#   {honey}  Honigstand
#   {id}  Kennung des verwalteten Objekts
#   {imported}  Importierte Einträge
#   {indicators}  Anzahl der Schadensanzeigen
#   {interactPermission}  Interaktionsberechtigung
#   {interactionRange}  Maximale Interaktionsentfernung
#   {item}  Verarbeiteter Gegenstand
#   {key}  Nachrichten- oder Parameterschlüssel
#   {kind}  Dokument- oder Standardwerttyp
#   {kinds}  Geänderte Dateitypen
#   {labels}  Anzahl der Beschriftungen
#   {legacy}  Kennung in der Importquelle
#   {level}  Aktueller Füllstand
#   {limit}  Erlaubter absoluter Grenzwert
#   {line}  Zeilennummer
#   {locale}  Sprachkennung
#   {maximum}  Maximalwert oder Kapazität
#   {maximumBees}  Maximale Bienenanzahl
#   {maximumHoney}  Maximaler Honigstand
#   {menu}  Menü-ID
#   {message}  Nachrichtentext
#   {migrated}  Migrierte Einträge
#   {minimum}  Erlaubter Mindestwert
#   {mode}  Sichtbarkeits- oder Folgemodus
#   {name}  Name des Objekts oder Dokuments
#   {oldBoard}  Bisherige Panel-ID
#   {operation}  Ausgeführter Vorgang
#   {options}  Erlaubte Werte
#   {overlaid}  Übernommene Konfigurationsschlüssel
#   {page}  Aktuelle Seite
#   {pages}  Anzahl der Seiten
#   {panels}  Anzahl der Panels
#   {parameter}  Parametername
#   {path}  Datei- oder Quellpfad
#   {pending}  Status ausstehender Änderungen
#   {percent}  Fortschritt in Prozent
#   {permission}  Erforderliche Berechtigung
#   {personal}  Persönliche Sprache
#   {pitch}  Vertikale Drehung
#   {player}  Spielername
#   {plugin}  Pluginname
#   {priority}  Auswahlpriorität
#   {provider}  Name des Gegenstandsanbieters
#   {providers}  Anzahl der Anbieter
#   {radius}  Suchradius in Blöcken
#   {ready}  Importbereite Einträge
#   {reason}  Ergebnis- oder Fehlergrund
#   {resume}  Fortsetzbare Migrationseinträge
#   {revision}  Dokumentrevision
#   {roll}  Drehung um die Blickachse
#   {rotation}  Drehmodus beim Folgen
#   {scale}  Darstellungsskalierung
#   {seconds}  Dauer oder Frist in Sekunden
#   {session}  ID der Bearbeitungssitzung
#   {severity}  Schweregrad des Problems
#   {skipped}  Übersprungene Einträge
#   {slots}  Anzahl der Plätze
#   {source}  Kopier- oder Importquelle
#   {special}  Anzahl der Spezialelemente
#   {state}  Panel- oder Importstatus
#   {style}  Name des Sprechblasenstils
#   {subject}  ID des bearbeiteten Dokuments
#   {target}  Plugin für die Sprachauswahl
#   {temporary}  Anzahl temporärer Hologramme
#   {text}  Zeileninhalt
#   {title}  Scoreboard-Titel
#   {to}  Letzter angezeigter Eintrag
#   {total}  Gesamtzahl der Einträge
#   {type}  Parametertyp
#   {url}  Webadresse
#   {usage}  Befehlssyntax
#   {uuid}  Vollständige UUID
#   {value}  Aktueller, voreingestellter oder eingegebener Wert
#   {variables}  Variablen der Nachricht
#   {variants}  Scoreboard-Varianten
#   {viewPermission}  Sichtberechtigung
#   {viewRange}  Maximale Sichtweite
#   {warnings}  Anzahl der Warnungen
#   {when}  Auswahlbedingung
#   {world}  Weltname
#   {x}  X-Koordinate
#   {y}  Y-Koordinate
#   {yaw}  Horizontale Drehung
#   {z}  Z-Koordinate

