name: ${name}
version: ${version}
main: ${main}
api-version: ${apiVersion}
load: POSTWORLD
description: Holograms, menus, panels, previews, scoreboards, tablist, emoji chat, chat bubbles, damage indicators and display-backed drops.
authors: [ VolmitSoftware ]
website: VolmitSoftware.com
softdepend: [ PlaceholderAPI, Vault, ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot, CraftEngine, ItemsAdder, Oraxen, Nexo, MMOItems, ExecutableItems, EcoItems, Slimefun, MythicMobs, HeadDatabase, WorldGuard, GriefPrevention, Towny, Lands, PlotSquared ]
commands:
  gloss:
    description: Gloss base command.
    aliases: [ gl, glo, gg ]
    usage: /<command> help
  hologram:
    description: Gloss hologram commands.
    aliases: [ holo, h ]
    usage: /<command> help
  board:
    description: Gloss scoreboard commands.
    aliases: [ sb, bd ]
    usage: /<command> help
  msg:
    description: Send a private message.
    aliases: [ tell, w ]
    usage: /<command> <player> <message>
  r:
    description: Reply to the last private message.
    usage: /<command> <message>
  ch:
    description: Choose your chat channel.
    usage: /<command> <channel|list>
permissions:
  gloss.debugdump:
    description: Allows creating and optionally uploading diagnostic reports.
    default: op
  gloss.language.self:
    description: Allows choosing your own language for this plugin.
    default: true
  gloss.*:
    description: Gives access to all Gloss permissions.
    default: op
    children:
      gloss.debugdump: true
      gloss.language.self: true
      gloss.admin: true
      gloss.holograms: true
      gloss.boards: true
      gloss.menus: true
      gloss.panels: true
      gloss.preview: true
      gloss.previews: true
      gloss.items: true
      gloss.web: true
      gloss.import: true
      gloss.emoji.use: true
      gloss.chat.color: true
      gloss.bubbles.send: true
      gloss.bubbles.style: true
      gloss.indicators.show: true
      # Lane parent nodes: each lane lists its gloss.<group> parent inside its own anchor.
      # --- lane:screen ---
      gloss.surfaces.reset: true
      gloss.surfaces.test: true
      gloss.nametags.reset: true
      gloss.nametags.refresh: true
      gloss.hud.who: true

      # --- lane:chat ---
      gloss.chat.msg: true
      gloss.chat.channel: true
      gloss.chat.mention: true
      gloss.chat.item: true
      gloss.channels: true
      gloss.strings: true
      gloss.leaderboards: true

      # --- lane:forms ---
      gloss.dialogs: true
      gloss.inventories: true

      # --- lane:rigs ---
      gloss.rigs: true
      gloss.motion: true

      # --- lane:world ---
      gloss.markers: true
      gloss.waypoints: true
      gloss.zones: true
      gloss.camera: true
      gloss.nameplates: true
      gloss.glow: true

      # --- lane:behaviors ---
      gloss.behaviors: true
      gloss.state: true
      gloss.debug.expr: true
      gloss.debug.explain: true

      # --- lane:authoring ---
      gloss.packs: true
      gloss.history: true
      gloss.check: true
      gloss.export: true

      # --- lane:forge ---
      gloss.forge: true

      # --- lane:fixes ---

  gloss.admin:
    description: Allows viewing status and restoring shipped defaults.
    default: op
    children:
      gloss.emoji.reset: true
      gloss.animations.reset: true
      gloss.bubbles.reset: true
      gloss.tablist.reset: true
      gloss.motd.reset: true
      gloss.drops.reset: true
      gloss.indicators.reset: true
  gloss.holograms:
    description: Gives access to all Gloss hologram permissions.
    default: op
    children:
      gloss.holograms.create: true
      gloss.holograms.edit: true
      gloss.holograms.delete: true
      gloss.holograms.move: true
      gloss.holograms.teleport: true
  gloss.holograms.create:
    description: Allows creating holograms.
    default: op
  gloss.holograms.edit:
    description: Allows editing hologram lines and orientation.
    default: op
  gloss.holograms.delete:
    description: Allows deleting holograms.
    default: op
  gloss.holograms.move:
    description: Allows moving holograms.
    default: op
  gloss.holograms.teleport:
    description: Allows teleporting to holograms.
    default: op
  gloss.boards:
    description: Gives access to all Gloss scoreboard permissions.
    default: op
    children:
      gloss.boards.create: true
      gloss.boards.edit: true
      gloss.boards.delete: true
      gloss.boards.show: true
      gloss.boards.hide: true
  gloss.boards.create:
    description: Allows creating scoreboards.
    default: op
  gloss.boards.edit:
    description: Allows editing scoreboard presentations, selection conditions and restoring shipped boards.
    default: op
  gloss.boards.delete:
    description: Allows deleting scoreboards.
    default: op
  gloss.boards.show:
    description: Allows showing scoreboards to yourself.
    default: op
  gloss.boards.hide:
    description: Allows hiding your scoreboard.
    default: op
  gloss.menus:
    description: Gives access to all Gloss hologram-menu permissions.
    default: op
    children:
      gloss.menus.list: true
      gloss.menus.open: true
      gloss.menus.close: true
      gloss.menus.move: true
      gloss.menus.back: true
      gloss.menus.create: true
      gloss.menus.edit: true
  gloss.menus.list:
    description: Allows listing hologram menus.
    default: op
  gloss.menus.open:
    description: Allows opening hologram menus.
    default: op
  gloss.menus.close:
    description: Allows closing your open menu session.
    default: op
  gloss.menus.move:
    description: Allows moving your open menu session.
    default: op
  gloss.menus.back:
    description: Allows reopening your previous menu session.
    default: op
  gloss.menus.create:
    description: Allows creating a hologram menu and the panel that places it; also requires gloss.panels.
    default: op
  gloss.menus.edit:
    description: Allows editing menu content.
    default: op
  gloss.panels:
    description: Allows managing persistent world panels.
    default: op
  gloss.preview:
    description: Allows seeing container previews and adjusting their scale.
    default: op
  gloss.previews:
    description: Allows inspecting container-preview documents.
    default: op
    children:
      gloss.previews.reset: true
      gloss.previews.dump: true
  gloss.previews.reset:
    description: Allows restoring shipped container-preview documents.
    default: op
  gloss.previews.dump:
    description: Allows dumping compiled container-preview documents.
    default: op
  gloss.items:
    description: Allows inspecting custom item providers.
    default: op
    children:
      gloss.items.export: true
  gloss.items.export:
    description: Allows exporting the custom item catalog for the web editor.
    default: op
  gloss.web:
    description: Gives access to all Gloss web editor permissions.
    default: op
    children:
      gloss.web.open: true
      gloss.web.edit: true
      gloss.web.workspace: true
      gloss.web.sessions: true
  gloss.web.open:
    description: Allows opening an empty hosted Gloss editor.
    default: op
  gloss.web.edit:
    description: Allows opening individual live Gloss documents in the web editor.
    default: op
  gloss.web.workspace:
    description: Allows opening the complete live Gloss workspace.
    default: op
  gloss.web.sessions:
    description: Allows managing live Gloss web editor sessions.
    default: op
  gloss.import:
    description: Allows previewing legacy hologram migrations.
    default: op
    children:
      gloss.import.apply: true
  gloss.import.apply:
    description: Allows applying legacy hologram migrations.
    default: op
  gloss.emoji.use:
    description: Allows using emoji in chat.
    default: true
  gloss.emoji.reset:
    description: Allows restoring shipped emoji defaults.
    default: op
  gloss.animations.reset:
    description: Allows restoring shipped animation defaults.
    default: op
  gloss.chat.color:
    description: Allows using color codes in chat.
    default: op
  gloss.bubbles.send:
    description: Chat messages from this player display as chat bubbles.
    default: true
  gloss.bubbles.style:
    description: Allows choosing a personal chat bubble style.
    default: op
  gloss.bubbles.reset:
    description: Allows restoring shipped bubble style defaults.
    default: op
  gloss.tablist.reset:
    description: Allows restoring the shipped tablist document.
    default: op
  gloss.motd.reset:
    description: Allows restoring the shipped MOTD document.
    default: op
  gloss.drops.reset:
    description: Allows restoring the shipped real drop settings document.
    default: op
  gloss.indicators.reset:
    description: Allows restoring the shipped damage-indicator settings document.
    default: op
  gloss.indicators.show:
    description: Shows damage and heal indicators to this player.
    default: true
  # Lane permission nodes: each lane declares its gloss.<group> tree inside its own anchor.
  # --- lane:screen ---
  gloss.surfaces.reset:
    description: Allows restoring the shipped surface documents.
    default: op
  gloss.surfaces.test:
    description: Allows running the surface pass for a player on demand.
    default: op
  gloss.nametags.reset:
    description: Allows restoring the shipped nametag documents.
    default: op
  gloss.nametags.refresh:
    description: Allows re-applying every nametag on demand.
    default: op
  gloss.hud.who:
    description: Allows inspecting which plugin owns each HUD slot for a player.
    default: op

  # --- lane:chat ---
  gloss.chat.msg:
    description: Allows sending private messages with /msg and /r.
    default: true
  gloss.chat.channel:
    description: Allows choosing your chat channel with /ch.
    default: true
  gloss.chat.mention:
    description: Mentions typed by this player highlight for the player they name.
    default: true
  gloss.chat.item:
    description: Allows expanding the held-item token in chat.
    default: true
  gloss.channels:
    description: Allows inspecting chat channel documents.
    default: op
    children:
      gloss.channels.reset: true
  gloss.channels.reset:
    description: Allows restoring shipped chat channel documents.
    default: op
  gloss.strings:
    description: Allows inspecting authored content string documents.
    default: op
    children:
      gloss.strings.reset: true
  gloss.strings.reset:
    description: Allows restoring shipped content string documents.
    default: op
  gloss.leaderboards:
    description: Allows inspecting leaderboard documents and their ranked entries.
    default: op
    children:
      gloss.leaderboards.reset: true
      gloss.leaderboards.sample: true
  gloss.leaderboards.reset:
    description: Allows clearing leaderboard period or all-time values.
    default: op
  gloss.leaderboards.sample:
    description: Allows sampling a leaderboard for every online player on demand.
    default: op

  # --- lane:forms ---
  gloss.dialogs:
    description: Allows listing and inspecting dialog documents.
    default: op
  gloss.dialogs.info:
    description: Allows inspecting a dialog document.
    default: op
  gloss.dialogs.open:
    description: Allows opening a dialog for a player.
    default: op
  gloss.dialogs.reset:
    description: Allows restoring the shipped dialog documents.
    default: op
  gloss.inventories:
    description: Allows listing and inspecting inventory menus.
    default: op
  gloss.inventories.info:
    description: Allows inspecting an inventory menu.
    default: op
  gloss.inventories.open:
    description: Allows opening an inventory menu for a player.
    default: op
  gloss.inventories.reset:
    description: Allows restoring the shipped inventory menus.
    default: op

  # --- lane:rigs ---
  gloss.rigs:
    description: Gives access to all Gloss rig permissions.
    default: op
    children:
      gloss.rigs.place: true
      gloss.rigs.edit: true
      gloss.rigs.remove: true
      gloss.rigs.import: true
  gloss.rigs.place:
    description: Allows placing rig instances.
    default: op
  gloss.rigs.edit:
    description: Allows moving, rotating, scaling and driving rig instances and restoring shipped rigs.
    default: op
  gloss.rigs.remove:
    description: Allows removing rig instances.
    default: op
  gloss.rigs.import:
    description: Allows importing Blockbench models as rigs.
    default: op
  gloss.motion:
    description: Gives access to all Gloss motion permissions.
    default: op
    children:
      gloss.motion.reset: true
  gloss.motion.reset:
    description: Allows restoring the shipped motion documents.
    default: op

  # --- lane:world ---
  gloss.markers:
    description: Gives access to every world marker command.
    default: op
    children:
      gloss.markers.list: true
      gloss.markers.info: true
      gloss.markers.create: true
      gloss.markers.remove: true
      gloss.markers.here: true
  gloss.markers.list:
    description: Allows listing world markers.
    default: op
  gloss.markers.info:
    description: Allows inspecting one world marker.
    default: op
  gloss.markers.create:
    description: Allows writing a new world marker document.
    default: op
  gloss.markers.remove:
    description: Allows deleting a world marker document.
    default: op
  gloss.markers.here:
    description: Allows printing your position as marker anchor coordinates.
    default: op
  gloss.waypoints:
    description: Gives access to every locator bar waypoint command.
    default: op
    children:
      gloss.waypoints.list: true
      gloss.waypoints.info: true
      gloss.waypoints.self: true
  gloss.waypoints.list:
    description: Allows listing your personal waypoints.
    default: op
  gloss.waypoints.info:
    description: Allows inspecting one waypoint document.
    default: op
  gloss.waypoints.self:
    description: Allows saving and removing personal waypoints.
    default: true
  gloss.zones:
    description: Gives access to every zone command.
    default: op
    children:
      gloss.zones.list: true
      gloss.zones.info: true
      gloss.zones.create: true
      gloss.zones.remove: true
      gloss.zones.toggle: true
  gloss.zones.list:
    description: Allows listing zones.
    default: op
  gloss.zones.info:
    description: Allows inspecting one zone.
    default: op
  gloss.zones.create:
    description: Allows writing a new zone document.
    default: op
  gloss.zones.remove:
    description: Allows deleting a zone document.
    default: op
  gloss.camera:
    description: Gives access to every camera ride command.
    default: op
    children:
      gloss.camera.test: true
      gloss.camera.stop: true
  gloss.camera.test:
    description: Allows starting a demonstration camera ride.
    default: op
  gloss.camera.stop:
    description: Allows ending a camera ride early.
    default: op
  gloss.nameplates:
    description: Gives access to every nameplate command.
    default: op
    children:
      gloss.nameplates.list: true
      gloss.nameplates.info: true
      gloss.nameplates.reset: true
      gloss.nameplates.refresh: true
  gloss.nameplates.list:
    description: Allows listing nameplate documents.
    default: op
  gloss.nameplates.info:
    description: Allows inspecting one nameplate document.
    default: op
  gloss.nameplates.reset:
    description: Allows restoring the shipped nameplate document.
    default: op
  gloss.nameplates.refresh:
    description: Allows rebuilding every viewer's nameplates.
    default: op
  gloss.glow:
    description: Gives access to every entity glow command.
    default: op
    children:
      gloss.glow.set: true
      gloss.glow.clear: true
  gloss.glow.set:
    description: Allows making a player glow for you.
    default: op
  gloss.glow.clear:
    description: Allows clearing a player's glow for you.
    default: op
  gloss.zones.toggle:
    description: Shows zone outlines to this player and allows toggling them.
    default: true

  # --- lane:behaviors ---
  gloss.behaviors:
    description: Allows listing and inspecting behavior documents.
    default: op
    children:
      gloss.behaviors.do: true
      gloss.behaviors.fire: true
      gloss.behaviors.reset: true
  gloss.behaviors.do:
    description: Allows firing behavior command entries with /gloss do.
    default: true
  gloss.behaviors.fire:
    description: Allows running one behavior entry by hand.
    default: op
  gloss.behaviors.reset:
    description: Allows restoring the shipped behavior documents.
    default: op
  gloss.state:
    description: Allows reading and writing persisted behavior state.
    default: op
  gloss.debug.expr:
    description: Allows evaluating expressions with /gloss expr.
    default: op
  gloss.debug.explain:
    description: Allows explaining conditional runtimes with /gloss explain.
    default: op

  # --- lane:authoring ---
  gloss.packs:
    description: Allows listing and inspecting installed Gloss packs.
    default: op
    children:
      gloss.packs.install: true
      gloss.packs.update: true
      gloss.packs.remove: true
  gloss.packs.install:
    description: Allows installing a Gloss pack from a file or an HTTPS URL.
    default: op
  gloss.packs.update:
    description: Allows updating an installed Gloss pack from its source.
    default: op
  gloss.packs.remove:
    description: Allows removing an installed Gloss pack.
    default: op
  gloss.history:
    description: Allows listing the stored versions of a document.
    default: op
    children:
      gloss.history.restore: true
  gloss.history.restore:
    description: Allows writing a stored version back over the live document.
    default: op
  gloss.check:
    description: Allows running the workspace check.
    default: op
  gloss.export:
    description: Allows exporting documents out of the data folder.
    default: op

  # --- lane:forge ---
  gloss.forge:
    description: Allows viewing glyph forge status.
    default: op
    children:
      gloss.forge.build: true
      gloss.forge.export: true
      gloss.forge.serve: true
      gloss.forge.reset: true
  gloss.forge.build:
    description: Allows rebuilding the glyph resource pack.
    default: op
  gloss.forge.export:
    description: Allows exporting the mergeable glyph pack folder.
    default: op
  gloss.forge.serve:
    description: Allows starting and stopping the embedded pack listener.
    default: op
  gloss.forge.reset:
    description: Allows restoring the shipped glyph documents.
    default: op

  # --- lane:fixes ---

