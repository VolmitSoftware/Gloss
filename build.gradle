import org.gradle.api.tasks.Copy
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
    alias(libs.plugins.slimjar)
}

group = 'art.arcane'
version = '3.0.0-26.2'
def apiVersion = '26.1'
def main = 'art.arcane.gloss.Gloss'
def lib = 'art.arcane.gloss.libs'
def spigotApiVersion = '26.2-R0.1-SNAPSHOT'
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()
String authTokenProperty = providers.gradleProperty('authToken').orNull
String jitpackAuthToken = authTokenProperty ?: providers.gradleProperty('jitpackAuthToken').orNull

def shadowJarTask = tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
tasks.named('slimJar').get()

tasks.register('buildPsychoLT', Copy) {
    group = 'development'
    description = 'Builds and deploys Gloss to the managed Minecraft test-server dropins.'
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(tasks.named('check'), shadowJarTask)
    from(shadowJarTask.flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('../../[Minecraft Server]/consumers/plugin-consumers/dropins/plugins'))
    rename { String ignored -> 'Gloss.jar' }
}

tasks.named('jar').configure {
    enabled = false
}

def apiJarTask = tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Packages only the public third-party API so other plugins can compile against it.'
    archiveClassifier.set('api')
    from(sourceSets.main.output) {
        include 'art/arcane/gloss/api/**'
        exclude 'art/arcane/gloss/api/internal/**'
    }
}

tasks.named('build').configure {
    dependsOn(shadowJarTask, apiJarTask)
}

shadowJarTask.configure {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    minimize()
    relocate('io.github.slimjar', "${lib}.slimjar")
    relocate('com.github.retrooper.packetevents', "${lib}.packetevents.api")
    relocate('io.github.retrooper.packetevents', "${lib}.packetevents.impl")
    relocate('org.bstats', "${lib}.bstats")
}

slimJar {
    relocate('com.github.retrooper.packetevents', "${lib}.packetevents.api")
    relocate('io.github.retrooper.packetevents', "${lib}.packetevents.impl")
    relocate('org.bstats', "${lib}.bstats")
    relocate('org.apache.commons', "${lib}.commons")
    relocate('net.kyori', "${lib}.kyori")
    relocate('com.moandjiezana.toml', "${lib}.toml")
}

tasks.named('processResources').configure {
    def pluginProperties = [
        name      : rootProject.name,
        version   : project.version,
        main      : main,
        apiVersion: apiVersion,
    ]

    inputs.properties(pluginProperties)
    filesMatching(['**/paper-plugin.yml', '**/plugin.yml']) {
        expand(pluginProperties)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    options.release.set(25)
}

tasks.named('test').configure {
    useJUnitPlatform()
    systemProperty('gloss.projectVersion', project.version.toString())
}

configurations {
    spigotCompatibility
}

tasks.register('compileSpigotCompatibility', JavaCompile) {
    source = fileTree('src/main/java') {
        exclude '**/paper/**'
    }
    classpath = files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-')
    }) + configurations.spigotCompatibility
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/spigotCompatibility'))
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    options.release.set(25)
}

gradle.includedBuilds.find { includedBuild -> includedBuild.name == 'VolmLib' }?.with { includedBuild ->
    File spigotClasses = new File(includedBuild.projectDir, 'shared/build/classes/java/spigotCompatibility')
    tasks.named('compileSpigotCompatibility').configure {
        dependsOn(includedBuild.task(':shared:compileSpigotCompatibility'))
        classpath = files(spigotClasses) + classpath
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('compileSpigotCompatibility'))
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://libraries.minecraft.net/')
    }
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
    maven {
        url = uri('https://repo.codemc.io/repository/maven-releases/')
    }
    maven {
        url = uri('https://repo.codemc.io/repository/maven-snapshots/')
    }
    maven {
        url = uri('https://repo.aikar.co/content/groups/aikar/')
    }
    maven {
        url = uri('https://jitpack.io')
        if (jitpackAuthToken != null) {
            credentials {
                username = jitpackAuthToken
                password = '.'
            }
        }
    }
    maven {
        url = uri('https://repo.momirealms.net/releases/')
    }
    maven {
        url = uri('https://repo.oraxen.com/releases')
    }
    maven {
        url = uri('https://repo.nexomc.com/releases/')
    }
    maven {
        url = uri('https://maven.devs.beer/')
    }
    maven {
        url = uri('https://nexus.phoenixdevt.fr/repository/maven-public/')
    }
    maven {
        url = uri('https://repo.auxilor.io/repository/maven-public/')
    }
    maven {
        url = uri('https://mvn.lumine.io/repository/maven-public/')
    }
}

dependencies {
    implementation('de.crazydev22.slimjar.helper:spigot:2.1.9')
    compileOnly('me.clip:placeholderapi:2.11.6') { transitive = false }
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
    compileOnly(libs.paper)
    spigotCompatibility("org.spigotmc:spigot-api:${spigotApiVersion}")
    implementation(libs.bstats)
    implementation(volmLibCoordinate) {
        changing = true
        transitive = false
    }

    compileOnly(libs.craftengine.core) { transitive = false }
    compileOnly(libs.craftengine.bukkit) { transitive = false }
    compileOnly(libs.itemsadder) { transitive = false }
    compileOnly(libs.oraxen) { transitive = false }
    compileOnly(libs.nexo) { transitive = false }
    compileOnly(libs.mmoitems) { transitive = false }
    compileOnly(libs.mythiclib) { transitive = false }
    compileOnly(libs.score) { transitive = false }
    compileOnly(libs.eco) { transitive = false }
    compileOnly(libs.slimefun) { transitive = false }
    compileOnly(libs.mythic) { transitive = false }
    compileOnly(libs.headDatabase) { transitive = false }

    slim(libs.packetevents) {
        exclude(group: 'net.kyori')
    }
    slim(libs.adventure.minimessage)
    slim(libs.adventure.nbt)
    slim(libs.adventure.legacy)
    slim(libs.commons.io)
    slim(libs.commons.imaging)
    slim(libs.toml4j) {
        exclude(group: 'com.google.code.gson')
    }

    testImplementation('me.clip:placeholderapi:2.11.6') { transitive = false }
    testImplementation('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
    testImplementation(libs.paper)
    testImplementation(libs.junitJupiter)
    testImplementation(libs.junit4)
    testRuntimeOnly(libs.junitVintage)
    testRuntimeOnly(libs.junitPlatformLauncher)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
    resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    System.err.println()
    System.err.println('=========================================================================================================')
    System.err.println('You must run gradle on Java 25 or newer. You are using ' + JavaVersion.current())
    System.err.println()
    System.err.println('=== For IDEs ===')
    System.err.println('1. Configure the project for Java 25')
    System.err.println('2. Configure the bundled gradle to use Java 25 in settings')
    System.err.println()
    System.err.println('=== For Command Line (gradlew) ===')
    System.err.println('1. Install JDK 25 from https://adoptium.net/temurin/releases/?version=25')
    System.err.println('2. Set JAVA_HOME environment variable to the new jdk installation folder')
    System.err.println('3. Open a new command prompt window to get the new environment variables if need be.')
    System.err.println('=========================================================================================================')
    System.err.println()
    System.exit(69)
}
