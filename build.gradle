tasks.register('verifyLanguagePackaging') {
    dependsOn(universalJarTask)
    inputs.file(universalJarTask.flatMap { it.archiveFile })
    doLast {
        File artifact = universalJarTask.get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { java.util.jar.JarFile archive ->
            List<String> translations = archive.entries().findAll { java.util.jar.JarEntry entry ->
                !entry.directory && entry.name.startsWith('languages/')
            }.collect { java.util.jar.JarEntry entry -> entry.name }
            if (!translations.isEmpty()) {
                throw new GradleException("Runtime jar contains translation resources: ${translations}")
            }
        }
    }
}

configurations {
    modernJomlTestRuntime {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    modernJomlTestRuntime('org.joml:joml:1.10.9')
}

tasks.register('testModernJoml', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { File file -> !file.name.startsWith('joml-') } + configurations.modernJomlTestRuntime
    useJUnitPlatform()
    filter {
        includeTestsMatching('art.arcane.gloss.drop.RealDropRotationCompatibilityTest')
        includeTestsMatching('art.arcane.gloss.drop.RealDropAnimationEngineTest.flatItemContinuouslySettlesOntoItsBroadFace')
        includeTestsMatching('art.arcane.gloss.drop.RealDropAnimationEngineTest.settledFramesStopEmittingPoseChanges')
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('verifyLanguagePackaging'), tasks.named('testModernJoml'))
}

pluginPackaging {
    loggingPolicy {
        forbid('.sendMessage(', 'Logger.getLogger(', 'getLogger().info(', 'getLogger().warning(',
                'getLogger().severe(', 'getLogger().fine(', 'getLogger().log(')
    }
    artifacts {
        create('distribution') {
            releaseCompression = true
            taskName = 'universalJar'
            policyName = 'Gloss'
            shrink = false
            forbiddenPrefixes = forbiddenPrefixes + ['com/velocitypowered/', 'com/google/inject/']
            requiredEntries = requiredEntries + [
                'velocity-plugin.json',
                'gloss-velocity-slimjar.dat',
                'gloss-velocity-slimjar-resolutions.dat',
                'art/arcane/gloss/velocity/GlossVelocity.class',
                'art/arcane/gloss/velocity/ProxyPacketEvents.class',
                'art/arcane/gloss/velocity/ProxyScoreboards.class',
                'art/arcane/gloss/velocity/expr/ExprEvaluator.class',
                'art/arcane/gloss/velocity/libs/gson/Gson.class',
                'art/arcane/gloss/velocity/libs/slimjar/app/builder/InjectingApplicationBuilder.class',
                'proxy-defaults/proxy.json'
            ]
        }
        create('bukkit') {
            taskName = 'shadowJar'
