            prunePrefixes = ['art/arcane/volmlib/']
            keepPrefixes = ['art/arcane/volmlib/util/matter/slices/', 'art/arcane/volmlib/nativelib/']
            shrinkRules = [file('packaging/shrink.pro')]
            shrinkRelocations = [
                'com.github.retrooper.packetevents': "${lib}.packetevents.api",
                'io.github.retrooper.packetevents' : "${lib}.packetevents.impl",
                'org.bstats'                       : "${lib}.bstats",
                'org.apache.commons'               : "${lib}.commons",
                'net.kyori'                        : "${lib}.kyori",
                'com.moandjiezana.toml'            : "${lib}.toml"
            ]
        }
    }
}

tasks.named('build') { dependsOn(':velocity:build') }


tasks.register('verifyPlatformPackaging') {
    dependsOn(universalJarTask)
    inputs.file(universalJarTask.flatMap { it.archiveFile })
    doLast {
        File artifact = universalJarTask.get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { java.util.jar.JarFile archive ->
            Map descriptor = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getJarEntry('velocity-plugin.json')))
            if (descriptor.main != 'art.arcane.gloss.velocity.GlossVelocity' || descriptor.version != project.version.toString()) {
                throw new GradleException('Velocity descriptor must match the main Gloss release')
            }
            Object dependencies = descriptor.dependencies
            if (dependencies instanceof Collection) {
                boolean requiresPacketEvents = dependencies.any { Object entry ->
                    String id = entry instanceof Map ? entry.id?.toString() : entry?.toString()
                    return id == 'packetevents'
                }
                if (requiresPacketEvents) {
                    throw new GradleException('Velocity Gloss must not require a PacketEvents plugin jar')
                }
            }
            if (archive.getJarEntry('gloss-velocity-slimjar.dat') == null
                    || archive.getJarEntry('gloss-velocity-slimjar-resolutions.dat') == null) {
                throw new GradleException('Velocity Gloss must ship its PacketEvents slimjar manifests')
            }
            String scoreboard = new String(archive.getInputStream(archive.getJarEntry('art/arcane/gloss/velocity/ProxyScoreboards.class')).readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
            for (String reference : ['com/github/retrooper/packetevents/PacketEvents', 'net/kyori/adventure/text/Component']) {
                if (!scoreboard.contains(reference)) {
                    throw new GradleException("Velocity API reference was relocated: ${reference}")
                }
            }
            if (scoreboard.contains('art/arcane/gloss/libs/')) {
                throw new GradleException('Velocity bytecode must not reference Bukkit-relocated libraries')
            }
        }
    }
}

tasks.named('check') { dependsOn(tasks.named('verifyPlatformPackaging')) }
