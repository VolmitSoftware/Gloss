import org.gradle.api.tasks.Copy
import org.gradle.api.tasks.WriteProperties
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath('com.github.VolmitSoftware.VolmLib:packaging:master-SNAPSHOT')
    }
}

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
    alias(libs.plugins.slimjar)
}

apply plugin: 'art.arcane.volmit-packaging'

group = 'art.arcane'
version = '3.0.3-26.2'
def apiVersion = '26.1'
def main = 'art.arcane.gloss.Gloss'
def lib = 'art.arcane.gloss.libs'
def spigotApiVersion = '26.2-R0.1-SNAPSHOT'
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()
String authTokenProperty = providers.gradleProperty('authToken').orNull
String jitpackAuthToken = authTokenProperty ?: providers.gradleProperty('jitpackAuthToken').orNull
List<String> languageLocales = fileTree('src/main/resources/languages') {
    include('*.toml')
}.files.collect { File source -> source.name.substring(0, source.name.length() - 5) }.sort()
def languageSourceManifestTask = tasks.register('generateLanguageSourceManifest', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file('generated/language-source/gloss-language-source.properties'))
    property('revision', 'master')
    property('locales', languageLocales.join(','))
}

def shadowJarTask = tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
evaluationDependsOn(':velocity')
def velocityJarTask = project(':velocity').tasks.named('shadowJar')
def universalJarTask = tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Packages the Bukkit and Velocity entry points in one Gloss plugin jar.'
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    dependsOn(shadowJarTask, velocityJarTask)
    from(shadowJarTask.flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude('META-INF/MANIFEST.MF')
    }
    from(velocityJarTask.flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude('META-INF/MANIFEST.MF')
        exclude('modules/loader-agent.isolated-jar')
    }
}
shadowJarTask.configure { finalizedBy(universalJarTask) }
tasks.named('assemble') { dependsOn(universalJarTask) }
tasks.named('slimJar').get()
File pluginOutDirectory = layout.projectDirectory.dir('../PluginOuts').asFile

tasks.register('buildPsychoLT', Copy) {
    group = 'development'
    description = 'Builds and deploys Gloss to the managed Minecraft test-server dropins.'
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(tasks.named('check'), universalJarTask)
    from(universalJarTask.flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('../../[Minecraft Server]/consumers/plugin-consumers/dropins/plugins'))
    rename { String ignored -> 'Gloss.jar' }
    doLast {
        project.copy {
            from(universalJarTask.get().archiveFile.get().asFile)
            into(pluginOutDirectory)
        }
    }
}

tasks.register('buildSwiftSwamp', Copy) {
    group = 'development'
    description = 'Builds and deploys Gloss to the local BUILDS output directory.'
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(tasks.named('check'), universalJarTask)
    from(universalJarTask.flatMap { it.archiveFile })
    into(file('C://VolmitSoftware/BUILDS'))
    rename { String ignored -> 'Gloss.jar' }
}

tasks.named('jar').configure {
    enabled = false
}

def apiJarTask = tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Packages only the public third-party API so other plugins can compile against it.'
    archiveClassifier.set('api')
    from(sourceSets.main.output) {
        include 'art/arcane/gloss/api/**'
        exclude 'art/arcane/gloss/api/internal/**'
    }
}

tasks.named('build').configure {
    dependsOn(universalJarTask, apiJarTask)
}

shadowJarTask.configure {
    exclude('com/fren_gor/**')
    exclude { FileTreeElement entry ->
        String nativePrefix = 'art/arcane/volmlib/nativelib/'
        if (entry.isDirectory() || !entry.path.startsWith(nativePrefix)) {
            return false
        }
        String relative = entry.path.substring(nativePrefix.length())
        if (!relative.contains('/')) {
            return false
        }
        List<String> segments = relative.tokenize('/')
        String capability = segments[0] == 'common' || segments[0].startsWith('v') ? segments[1] : segments[0]
        if (!['block', 'scoreboard', 'proxy'].contains(capability)) {
            return true
        }
        return false
    }
    destinationDirectory.set(layout.buildDirectory.dir('platform'))
    archiveClassifier.set('bukkit')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    minimize {
        exclude(dependency('com.github.VolmitSoftware.VolmLib:.*:.*'))
    }
    relocate('io.github.slimjar', "${lib}.slimjar")
    relocate('com.github.retrooper.packetevents', "${lib}.packetevents.api")
    relocate('io.github.retrooper.packetevents', "${lib}.packetevents.impl")
    relocate('org.bstats', "${lib}.bstats")
}

slimJar {
    relocate('com.github.retrooper.packetevents', "${lib}.packetevents.api")
    relocate('io.github.retrooper.packetevents', "${lib}.packetevents.impl")
    relocate('org.bstats', "${lib}.bstats")
    relocate('org.apache.commons', "${lib}.commons")
    relocate('net.kyori', "${lib}.kyori")
    relocate('com.moandjiezana.toml', "${lib}.toml")
}

tasks.named('processResources').configure {
    exclude('languages/**')
    from(languageSourceManifestTask)
    // The editor asks the server for a kind's JSON Schema when it has no dedicated stage for it.
    // Only the per-kind document schemas ship; gloss.schema.json describes gloss.toml, which the
    // editor never authors.
    from('schema') {
        into 'schema'
        include 'gloss-*.schema.json'
    }
    def pluginProperties = [
        name      : rootProject.name,
        version   : project.version,
        main      : main,
        apiVersion: apiVersion,
    ]

    inputs.properties(pluginProperties)
    filesMatching(['**/paper-plugin.yml', '**/plugin.yml']) {
        expand(pluginProperties)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    options.release.set(25)
}

tasks.named('test').configure {
    useJUnitPlatform()
    systemProperty('gloss.projectVersion', project.version.toString())
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
}

configurations {
    spigotCompatibility
}

tasks.register('compileSpigotCompatibility', JavaCompile) {
    source = fileTree('src/main/java') {
        exclude '**/paper/**'
    }
    classpath = files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-')
    }) + configurations.spigotCompatibility
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/spigotCompatibility'))
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    options.release.set(25)
}

gradle.includedBuilds.find { includedBuild -> includedBuild.name == 'VolmLib' }?.with { includedBuild ->
    File spigotClasses = new File(includedBuild.projectDir, 'shared/build/classes/java/spigotCompatibility')
    tasks.named('compileSpigotCompatibility').configure {
        dependsOn(includedBuild.task(':shared:compileSpigotCompatibility'))
        classpath = files(spigotClasses) + classpath
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('compileSpigotCompatibility'))
}

